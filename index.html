<style>
@font-face{font-family:Homebody;src:url('./KAHomebodyClub.ttf') format('truetype');font-display:swap}@font-face{font-family:VAG;src:url('./VAGRoundedBold.ttf') format('truetype');font-display:swap}
:root{--ink:#171717;--pink:#ff5b9f;--orange:#ff8b27;--yellow:#ffd83a;--green:#72d653;--blue:#43c1eb;--purple:#a152df}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:VAG,Arial,sans-serif;background:#f4f5f7;color:var(--ink);user-select:none}body{zoom:1}button{font:inherit}#shell{min-height:100vh;border:11px solid transparent;border-image:linear-gradient(90deg,#ff3b7d 0 14%,#ff7d1f 14% 28%,#ffd52b 28% 42%,#4ed163 42% 57%,#27b6e6 57% 71%,#7348e7 71% 86%,#ff3b7d 86%) 1;background:#fff}header{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:9px 18px 11px;border-bottom:5px solid #222;background:#fff;font-family:Homebody,VAG,sans-serif;text-transform:uppercase}.brand{font-family:Homebody,VAG,sans-serif;font-size:clamp(31px,4.1vw,61px);line-height:.92;letter-spacing:.2px;white-space:nowrap;background:linear-gradient(90deg,#f52c8b,#ff7a18,#e9bd08,#48bf4d,#149fd8,#7240da,#e43ac4);-webkit-background-clip:text;background-clip:text;color:transparent}.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.nav button{font-family:Homebody,VAG,sans-serif;text-transform:uppercase;padding:8px 13px;min-height:43px;border:4px solid #222;border-radius:14px;background:#fff;box-shadow:0 3px 0 #222;cursor:pointer}.nav button:active{transform:translateY(2px);box-shadow:0 1px 0 #222}main{padding:14px}.view{display:none}.view.active{display:block}.home-note{text-align:center;font-size:clamp(18px,2vw,25px);margin:1px 0 14px}.game-grid{max-width:1360px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.game-card{border:5px solid #222;border-radius:20px;overflow:hidden;background:#fff;padding:0;cursor:pointer;box-shadow:0 5px 0 #222;min-height:265px;display:grid;grid-template-rows:auto 1fr auto}.game-card:active{transform:translateY(3px);box-shadow:0 2px 0 #222}.game-card .bar{padding:9px 10px;text-align:left;font-size:clamp(21px,2vw,31px);display:flex;align-items:center;gap:10px;line-height:1}.game-num{width:42px;height:42px;flex:0 0 42px;border:4px solid #222;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px}.game-card .thumb{height:165px;border-top:4px solid #222;border-bottom:4px solid #222;background:#fff;display:grid;place-items:center;overflow:hidden;padding:5px}.game-card .thumb img{width:100%;height:100%;object-fit:contain}.game-card .desc{text-align:center;padding:8px 10px;font-size:17px;line-height:1.1;background:#fff}.c1 .bar{background:var(--pink)}.c2 .bar{background:var(--yellow)}.c3 .bar{background:var(--green)}.c4 .bar{background:var(--blue)}.c5 .bar{background:var(--purple)}.c6 .bar{background:var(--orange)}.c7 .bar{background:#62d6e7}
#gameTop{max-width:1420px;margin:0 auto 9px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}#gameTitle{font-size:clamp(25px,3vw,40px)}.stats{display:flex;gap:8px;justify-content:flex-end}.pill{border:4px solid #222;border-radius:999px;background:#fff;padding:7px 14px;font-size:18px}#direction{max-width:1420px;margin:0 auto 10px;border:4px solid #222;border-radius:17px;background:#fff;min-height:76px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;font-size:clamp(20px,2.1vw,30px)}#stage{max-width:1420px;height:650px;margin:auto;border:5px solid #222;border-radius:22px;background:#f7fbff;position:relative;overflow:hidden}#toast{position:absolute;z-index:99;left:50%;top:16px;transform:translateX(-50%);border:4px solid #222;border-radius:15px;background:#fff;padding:8px 15px;font-size:22px;opacity:0;pointer-events:none;transition:.15s}#toast.show{opacity:1}.win{position:absolute;inset:0;z-index:90;background:rgba(255,255,255,.94);display:grid;place-items:center;text-align:center}.winbox{border:6px solid #222;border-radius:25px;background:#fff;padding:25px 38px;box-shadow:0 7px 0 #222}.win h2{font-size:clamp(50px,8vw,105px);margin:0;color:#8039d4}.win p{font-size:23px}.win button{border:4px solid #222;border-radius:14px;padding:10px 18px;background:#ffd83a;margin:5px;cursor:pointer}
.catch-bg{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat}.catch-target{position:absolute;border:0;background:transparent;padding:18px;cursor:pointer;transition:left 1.25s ease-in-out,top 1.25s ease-in-out;animation:gentleHop 1.65s ease-in-out infinite alternate}.catch-target img{display:block;margin:auto;max-width:128px;max-height:112px;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 2px rgba(0,0,0,.15))}@keyframes gentleHop{from{transform:translateY(-7px) rotate(-2deg)}to{transform:translateY(7px) rotate(2deg)}}.reveal{position:absolute;inset:14px;border-radius:16px;background:#1b0d32;overflow:hidden;display:grid;place-items:center}.reveal>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#1b0d32}.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:3px}.tile{border:0;cursor:pointer;background:linear-gradient(145deg,#8d46e5,#ff5ba7);outline:2px solid rgba(255,255,255,.7)}.tile:nth-child(3n+2){background:linear-gradient(145deg,#27b9ea,#6ddc64)}.tile:nth-child(3n){background:linear-gradient(145deg,#ffd42b,#ff7e1e)}.tile.gone{opacity:0;pointer-events:none;transition:.2s}
.desktop{position:absolute;inset:15px;border:4px solid #222;border-radius:16px;background-position:center;background-size:cover;background-repeat:no-repeat;overflow:hidden}.taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:#273646}.folders{position:absolute;inset:32px 30px 72px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;align-items:center}.folder{border:0;background:transparent;cursor:pointer;display:grid;justify-items:center;gap:3px}.folderpic{position:relative;width:180px;height:145px}.folderpic>img:first-child{width:100%;height:100%;object-fit:contain}.folderpic .badge{position:absolute;width:66px;height:58px;object-fit:contain;left:50%;top:50%;transform:translate(-50%,-45%);background:#fff;border:3px solid #222;border-radius:9px;padding:3px}.folderlabel{background:#fff;border:3px solid #222;border-radius:9px;padding:4px 8px}.fakewindow{position:absolute;z-index:60;width:min(760px,82%);left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:5px solid #222;border-radius:17px;box-shadow:0 15px 30px rgba(0,0,0,.25);overflow:hidden}.winbar{height:45px;background:#45bce8;border-bottom:4px solid #222;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-size:21px}.winbar button{width:38px;height:33px;border:3px solid #222;border-radius:8px;background:#ff6c80;cursor:pointer}.wincontent{text-align:center;padding:16px;font-size:21px}.wincontent img{width:180px;height:150px;object-fit:contain}
.sceneWrap{position:absolute;top:14px;bottom:14px;left:50%;transform:translateX(-50%);aspect-ratio:16/9;max-width:calc(100% - 28px);border-radius:15px;overflow:hidden;background:#16102d}.sceneWrap>img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:3}.hotspot.good{outline:6px solid #56c94c;border-radius:13px;background:rgba(86,201,76,.12)}.hotspot.bad{outline:6px solid #ff5c76;border-radius:13px;background:rgba(255,92,118,.12)}
.matchLayout{position:absolute;inset:15px;display:grid;grid-template-columns:.78fr 1.22fr;gap:14px;background-position:center;background-size:cover;border:4px solid #222;border-radius:17px;padding:14px}.matchTarget,.matchChoices{border:4px solid #222;border-radius:17px;background:rgba(255,255,255,.94);padding:13px}.matchTarget{display:grid;place-items:center;text-align:center}.matchTarget .clue{font-size:clamp(23px,2.4vw,34px);line-height:1.15;padding:10px}.matchChoices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.matchChoice{border:4px solid #222;border-radius:15px;background:rgba(255,255,255,.96);cursor:pointer;display:grid;place-items:center;padding:8px;min-height:200px}.matchChoice img{width:165px;height:145px;object-fit:contain}.matchChoice div{font-size:18px}.collect{position:absolute;inset:15px;border:4px solid #222;border-radius:17px;background-position:center;background-size:cover;background-repeat:no-repeat;overflow:hidden}.collectItem{position:absolute;border:0;background:transparent;padding:10px;cursor:pointer;animation:bob 3.4s ease-in-out infinite alternate}.collectItem img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 3px rgba(0,0,0,.28))}.collectItem.gone{opacity:0;pointer-events:none;transition:.2s}@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}

@media(max-width:900px){header{grid-template-columns:1fr}.nav{justify-content:center}.brand{justify-content:center}.game-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#stage{height:720px}.folders{grid-template-columns:repeat(2,1fr)}.matchLayout{grid-template-columns:1fr}.matchChoices{grid-template-columns:repeat(4,1fr)}}@media(max-width:560px){.game-grid{grid-template-columns:1fr}.arcade{white-space:normal}}

.nav button{display:flex;align-items:center;gap:7px}.nav button img{width:30px;height:30px;object-fit:contain}
.game-card{position:relative}.game-card .bar{position:relative}.gameIcon{width:42px;height:42px;object-fit:contain;flex:0 0 42px}
.cardSpeak,.speakBtn{border:3px solid #222;border-radius:50%;background:#fff;cursor:pointer;display:inline-grid;place-items:center;padding:5px;width:44px;height:44px;min-width:44px;min-height:44px;box-shadow:0 2px 0 #222;color:#222}.cardSpeak{margin-left:auto}.speakerSvg{width:25px;height:25px;fill:currentColor;display:block}.speakBtn:active,.cardSpeak:active{transform:translateY(1px);box-shadow:none}

.wincontent .readRow{margin-top:8px}

.memoryCard{perspective:900px;border:0;background:transparent;padding:0;cursor:pointer;min-height:0;min-width:0;aspect-ratio:3/4;align-self:center;justify-self:stretch}
.memoryInner{position:relative;width:100%;height:100%;min-height:0;transition:transform .38s;transform-style:preserve-3d}
.memoryCard.flipped .memoryInner,.memoryCard.matched .memoryInner{transform:rotateY(180deg)}
.memoryFace{position:absolute;inset:0;border:4px solid #222;border-radius:16px;overflow:hidden;backface-visibility:hidden;background:#fff;display:grid;place-items:center}
.memoryBack{background:#281264;padding:5px}.memoryBack img{width:100%;height:100%;object-fit:contain;border-radius:11px;display:block}

.memoryCard.matched{opacity:.52;pointer-events:none}


</style></head><body><div id="shell"><header><div class="brand">MS. KAPLE'S DOUBLE-CLICK STEM ARCADE</div><div class="nav"><button id="homeBtn"><img src="controller.png" alt="">GAMES</button><button id="resetBtn"><img src="lightning.png" alt="">RESET</button><button id="prevBtn">◀ PREV</button><button id="nextBtn">NEXT ▶</button></div></header><main><section id="home" class="view active"><div class="home-note">CHOOSE A GAME</div><div id="cards" class="game-grid"></div></section><section id="game" class="view"><div id="gameTop"><div id="gameTitle"></div><div class="stats"><div class="pill">SCORE: <span id="score">0</span></div></div></div><div id="direction"></div><div id="stage"><div id="toast"></div></div></section></main></div>
<script>
const HOTSPOTS={"seek_scene.jpg": {"pencil": [47.524, 69.588, 1.14, 8.471], "scissors": [15.239, 59.024, 2.46, 9.6], "ruler": [50.516, 25.7, 0.78, 5.365], "glue": [83.171, 59.041, 2.22, 10.447], "notebook": [90.505, 83.294, 3.24, 9.882], "stapler": [5.407, 35.406, 4.56, 5.365]}};
const ASSETS={
pencil:{word:'PENCIL',img:'pencil.png'},scissors:{word:'SCISSORS',img:'scissors.png'},glue:{word:'GLUE',img:'glue.png'},marker:{word:'MARKER',img:'marker.png'},notebook:{word:'NOTEBOOK',img:'notebook.png'},ruler:{word:'RULER',img:'ruler.png'},tape:{word:'TAPE',img:'tape.png'},paper:{word:'PAPER',img:'paper.png'},paint:{word:'PAINT',img:'paint.png'},brush:{word:'PAINTBRUSH',img:'brush.png'},clock:{word:'CLOCK',img:'clock.png'},desk:{word:'DESK',img:'desk.png'},chair:{word:'CHAIR',img:'chair.png'},bookcase:{word:'BOOKCASE',img:'bookcase.png'},whiteboard:{word:'WHITEBOARD',img:'whiteboard.png'},group_table:{word:'TABLE',img:'group_table.png'},paperclip:{word:'PAPER CLIP',img:'paperclip.png'},stapler:{word:'STAPLER',img:'stapler.png'},eraser:{word:'ERASER',img:'eraser.png'},pen:{word:'PEN',img:'pen.png'},
controller:{word:'GAME CONTROLLER',img:'controller.png'},robot:{word:'ROBOT',img:'robot.png'},sneaker:{word:'SNEAKER',img:'sneaker.png'},lightning:{word:'LIGHTNING BOLT',img:'lightning.png'},icecream:{word:'ICE CREAM',img:'icecream.png'},skateboard:{word:'SKATEBOARD',img:'skateboard.png'},camera:{word:'CAMERA',img:'camera.png'},sunglasses:{word:'SUNGLASSES',img:'sunglasses.png'},drone:{word:'DRONE',img:'drone.png'},joystick:{word:'JOYSTICK',img:'joystick.png'},rocket:{word:'ROCKET',img:'rocket.png'},smartwatch:{word:'SMARTWATCH',img:'smartwatch.png'},microphone:{word:'MICROPHONE',img:'microphone.png'},rollerskate:{word:'ROLLER SKATE',img:'rollerskate.png'},popsicle:{word:'POPSICLE',img:'popsicle.png'},headphones:{word:'HEADPHONES',img:'headphones.png'},ufo:{word:'UFO',img:'ufo.png'},trophy:{word:'TROPHY',img:'trophy.png'},magnifier:{word:'MAGNIFYING GLASS',img:'magnifier.png'},pizza:{word:'PIZZA',img:'pizza.png'}
};
const SPACE=['spacev2_1.jpg','spacev2_2.jpg','spacev2_3.jpg','spacev2_4.jpg','spacev2_5.jpg','spacev2_6.jpg','spacev2_7.jpg','spacev2_8.jpg','spacev2_9.jpg','spacev2_10.jpg'];
const G=[
{title:'CATCH THE TECH',desc:'DOUBLE-CLICK THE MOVING TECH ITEM',c:'c1',type:'catch',thumb:'home_catch_space.jpg',icon:'drone.png'},
{title:'REVEAL THE PICTURE',desc:'DOUBLE-CLICK TILES TO UNCOVER IT',c:'c2',type:'reveal',thumb:'home_reveal.jpg',icon:'robot.png'},
{title:'OPEN THE FILE',desc:'DOUBLE-CLICK THE MATCHING FILE',c:'c3',type:'files',thumb:'home_files_space.jpg',icon:'camera.png'},
{title:'FIND IT IN THE SCENE',desc:'SEARCH THE PICTURE AND DOUBLE-CLICK IT',c:'c4',type:'hunt',thumb:'home_hunt.jpg',icon:'magnifier.png'},
{title:'PICK THE TECH',desc:'LISTEN OR READ, THEN DOUBLE-CLICK THE ANSWER',c:'c5',type:'match',thumb:'home_techpick_space.jpg',icon:'robot.png'},
{title:'COLLECT THEM ALL',desc:'DOUBLE-CLICK EVERY MATCHING ITEM',c:'c6',type:'collect',thumb:'home_collect_space.jpg',icon:'trophy.png'},
{title:'MEMORY MATCH',desc:'DOUBLE-CLICK CARDS AND MATCH THE PICTURES',c:'c7',type:'memory',thumb:'home_memory.jpg',icon:'controller.png'}
];
const cards=document.getElementById('cards'),home=document.getElementById('home'),game=document.getElementById('game'),stage=document.getElementById('stage'),direction=document.getElementById('direction'),gameTitle=document.getElementById('gameTitle'),scoreEl=document.getElementById('score');let current=0,score=0,round=1,timer=null;
function key(t,s){return `msKapleDC_${t}_${s}`}
function loadNum(k,d=0){const n=Number(localStorage.getItem(k));return Number.isFinite(n)?n:d}
function save(){localStorage.setItem(key(G[current].type,'score'),score);localStorage.setItem(key(G[current].type,'round'),round)}
function savedScore(type){return loadNum(key(type,'score'))}
function setScore(v){score=v;scoreEl.textContent=v;save()}
function setRound(v){round=v;save()}
function clearTimer(){if(timer){clearTimeout(timer);timer=null}}
function resetStage(){clearTimer();stage.innerHTML='<div id="toast"></div>'}
function speakText(text){
  if(!('speechSynthesis' in window)){toast('VOICE IS NOT AVAILABLE ON THIS COMPUTER.');return}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text).replace(/\s+/g,' ').trim());
  u.rate=.82;u.pitch=1.08;u.volume=1;
  const voices=window.speechSynthesis.getVoices();
  const v=voices.find(x=>/en-US/i.test(x.lang))||voices.find(x=>/^en/i.test(x.lang));
  if(v)u.voice=v;
  window.speechSynthesis.speak(u)
}
function speakerHTML(text){return `<button type="button" class="speakBtn" aria-label="Hear directions" data-speak="${String(text).replace(/"/g,'&quot;')}"><svg class="speakerSvg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"></path><path d="M16 8.5c1.3 1 2 2.1 2 3.5s-.7 2.5-2 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path><path d="M18.5 6c2.2 1.7 3.5 3.7 3.5 6s-1.3 4.3-3.5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>`}
function wireSpeakers(root=document){root.querySelectorAll('[data-speak]').forEach(b=>{if(b.dataset.wired)return;b.dataset.wired='1';b.addEventListener('click',e=>{e.stopPropagation();speakText(b.dataset.speak)})})}
function renderDirection(cue,visible,speech){
  direction.innerHTML=`${cue?`<img class="directionCue" src="${cue}" alt="">`:''}<span class="dirText">${visible}</span>${speakerHTML(speech||visible)}`;
  wireSpeakers(direction)
}
function dirPic(k,text){const a=ASSETS[k];const visible=text.replace('{{WORD}}',a.word);renderDirection(a.img,visible,visible)}
function dirText(t){renderDirection('',t,t)}
function toast(t){const e=document.getElementById('toast');if(!e)return;e.textContent=t;e.classList.add('show');clearTimeout(e._x);e._x=setTimeout(()=>e.classList.remove('show'),650)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
G.forEach((g,i)=>{
  const b=document.createElement('div');b.className=`game-card ${g.c}`;b.tabIndex=0;
  b.innerHTML=`<div class="bar"><span class="game-num">${i+1}</span><img class="gameIcon" src="${g.icon}" alt=""><span>${g.title}</span><button type="button" class="cardSpeak" aria-label="Hear game name"><svg class="speakerSvg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"></path><path d="M16 8.5c1.3 1 2 2.1 2 3.5s-.7 2.5-2 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path><path d="M18.5 6c2.2 1.7 3.5 3.7 3.5 6s-1.3 4.3-3.5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button></div><div class="thumb"><img src="${g.thumb}" alt=""></div><div class="desc">${g.desc}</div>`;
  const play=()=>startGame(i);
  b.addEventListener('click',e=>{if(!e.target.closest('.cardSpeak'))play()});
  b.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('.cardSpeak')){e.preventDefault();play()}});
  const sb=b.querySelector('.cardSpeak');sb.addEventListener('click',e=>{e.stopPropagation();speakText(`${g.title}. ${g.desc}`)});
  cards.appendChild(b)
});
function showHome(){clearTimer();game.classList.remove('active');home.classList.add('active');setTimeout(autoFitArcade,0)}
function startGame(i){current=(i+G.length)%G.length;home.classList.remove('active');game.classList.add('active');setTimeout(autoFitArcade,0);gameTitle.textContent=G[current].title;score=savedScore(G[current].type);round=Math.max(1,loadNum(key(G[current].type,'round'),1));scoreEl.textContent=score;setup()}
function resetCurrent(){localStorage.setItem(key(G[current].type,'score'),0);localStorage.setItem(key(G[current].type,'round'),1);score=0;round=1;scoreEl.textContent=0;setup()}
document.getElementById('homeBtn').onclick=showHome;
document.getElementById('resetBtn').onclick=resetCurrent;
document.getElementById('prevBtn').onclick=()=>startGame(current-1);
document.getElementById('nextBtn').onclick=()=>startGame(current+1);
function setup(){resetStage();const t=G[current].type;if(t==='catch')catchGame();if(t==='reveal')revealGame();if(t==='files')filesGame();if(t==='hunt')huntGame();if(t==='match')matchGame();if(t==='collect')collectGame();if(t==='memory')memoryGame();setTimeout(autoFitArcade,0)}
function win(){save();localStorage.setItem(key(G[current].type,'round'),1);const w=document.createElement('div');w.className='win';w.innerHTML=`<div class="winbox"><h2>YOU WIN!</h2><p>SCORE: ${score}</p>${speakerHTML(`You win! Your score is ${score}.`)}<br><button class="again">KEEP PLAYING</button><button class="homewin">GAMES</button></div>`;wireSpeakers(w);w.querySelector('.again').onclick=()=>{setRound(1);setup()};w.querySelector('.homewin').onclick=showHome;stage.appendChild(w)}


// AUTO-FIT FOR STUDENT COMPUTERS
// Calculates a browser zoom from BOTH screen width and height.
// Re-runs on load, resize, orientation change, and when switching games.
let fitRaf=null;
function autoFitArcade(){
  cancelAnimationFrame(fitRaf);
  fitRaf=requestAnimationFrame(()=>{
    // Temporarily return to 100% so viewport measurements are stable.
    document.body.style.zoom='1';

    const vw=(window.visualViewport&&window.visualViewport.width)||window.innerWidth||1366;
    const vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight||768;

    // Game view needs about 1510 x 980 CSS px at natural size.
    // Home has 7 cards and needs slightly more height.
    const onHome=document.getElementById('home')?.classList.contains('active');
    const designW=1510;
    const designH=onHome ? 1080 : 980;

    // Fit inside the current browser window with breathing room.
    let scale=Math.min((vw-16)/designW,(vh-16)/designH,1);

    // Chromebook/browser sanity limits: don't let it become microscopic.
    scale=Math.max(.50,Math.min(scale,1));

    document.body.style.zoom=scale.toFixed(3);
    document.documentElement.style.setProperty('--auto-fit-scale',scale.toFixed(3));
  });
}

const CATCH=[
{k:'drone',copies:1},{k:'controller',copies:1},{k:'robot',copies:1},

{k:'headphones',copies:2},{k:'ufo',copies:3},{k:'joystick',copies:3}
];
function catchGame(){
  const lev=Math.min(CATCH.length-1,Math.floor(score/5)),cfg=CATCH[lev];
  dirPic(cfg.k,'CATCH THE {{WORD}}! DOUBLE-CLICK IT.');
  const bg=document.createElement('div');bg.className='catch-bg';
  bg.style.backgroundImage=`url("${SPACE[lev%SPACE.length]}")`;
  stage.appendChild(bg);
  const movers=[];
  let pausedByHover=false;

  for(let i=0;i<cfg.copies;i++){
    const b=document.createElement('button');b.className='catch-target';
    b.style.width='190px';b.style.height='170px';
    b.style.animationDelay=(i*.24)+'s';
    b.innerHTML=`<img src="${ASSETS[cfg.k].img}" alt="${ASSETS[cfg.k].word}">`;
    b.addEventListener('click',e=>e.preventDefault());
    b.addEventListener('mouseenter',()=>{pausedByHover=true;clearTimer()});
    b.addEventListener('mouseleave',()=>{pausedByHover=false;scheduleDrift()});
    b.addEventListener('dblclick',e=>{
      e.preventDefault();
      setScore(score+1);toast('GREAT DOUBLE-CLICK!');
      const newLev=Math.min(CATCH.length-1,Math.floor(score/5));
      if(newLev!==lev){setTimeout(setup,300);return}
      moveOne(b,true);scheduleDrift()
    });
    stage.appendChild(b);movers.push(b)
  }

  function moveOne(b,quick=false){
    const W=stage.clientWidth,H=stage.clientHeight,w=190,h=170,pad=68;
    b.style.transitionDuration=quick?'.55s':'1.25s';
    b.style.left=(pad+Math.random()*Math.max(10,W-w-pad*2))+'px';
    b.style.top=(pad+Math.random()*Math.max(10,H-h-pad*2))+'px'
  }
  movers.forEach(b=>moveOne(b,true));

  function scheduleDrift(){
    clearTimer();
    if(pausedByHover)return;
    timer=setTimeout(()=>{
      if(pausedByHover)return;
      movers.forEach(b=>moveOne(b,false));
      scheduleDrift()
    },5200);
  }
  scheduleDrift()
}

// 7. Memory Match: DOUBLE-CLICK cards to flip; match six pairs per board.
const MEMORY_SETS=[
['camera','drone','controller','robot','rocket','headphones'],
['smartwatch','microphone','ufo','joystick','sneaker','skateboard'],
['magnifier','trophy','popsicle','pizza','icecream','sunglasses']
];
function memoryGame(){
  round=((round-1)%MEMORY_SETS.length)+1;save();
  dirText('DOUBLE-CLICK TWO CARDS. FIND ALL THE MATCHING PICTURES.');
  const board=document.createElement('div');board.className='memoryBoard';
  const keys=MEMORY_SETS[round-1];
  const deck=shuffle(keys.flatMap(k=>[k,k]));
  let first=null,second=null,locked=false,matched=0;
  deck.forEach((k,idx)=>{
    const card=document.createElement('button');card.className='memoryCard';card.type='button';
    card.innerHTML=`<div class="memoryInner"><div class="memoryFace memoryBack"><img src="memory_back.jpg" alt="card back"></div><div class="memoryFace memoryFront"><img src="${ASSETS[k].img}" alt="${ASSETS[k].word}"><span>${ASSETS[k].word}</span></div></div>`;
    card.addEventListener('click',e=>e.preventDefault());
    card.addEventListener('dblclick',e=>{
      e.preventDefault();
      if(locked||card.classList.contains('flipped')||card.classList.contains('matched'))return;
      card.classList.add('flipped');
      card.dataset.key=k;
      if(!first){first=card;return}
      second=card;locked=true;
      if(first.dataset.key===second.dataset.key){
        setTimeout(()=>{
          first.classList.add('matched');second.classList.add('matched');
          first=null;second=null;locked=false;matched++;setScore(score+1);toast('MATCH!');
          if(matched===keys.length){
            if(round>=MEMORY_SETS.length)setTimeout(win,550);
            else{setRound(round+1);setTimeout(setup,700)}
          }
        },420)
      }else{
        setTimeout(()=>{
          first.classList.remove('flipped');second.classList.remove('flipped');
          first=null;second=null;locked=false
        },900)
      }
    });
    board.appendChild(card)
  });
  stage.appendChild(board)
}
