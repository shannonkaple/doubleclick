<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ms. Kaple's Double-Click Arcade</title>
<style>
@font-face {font-family:'KAHomebody';src:url('./KAHomebodyClub.ttf') format('truetype');}
@font-face {font-family:'VAGRounded';src:url('./VAGRoundedBold.ttf') format('truetype');}
:root{--maroon:#8f1138;--ink:#1d1836;--cream:#fbfaf7;--shadow:0 8px 18px rgba(41,33,78,.12);}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:VAGRounded,Arial,sans-serif;background:#efefef;color:var(--ink);overflow:hidden}
button{font:inherit}
#app{height:100vh;display:grid;grid-template-rows:auto 1fr;background:#f7f7f7;border:6px solid #1b1630;box-shadow:0 0 0 8px #ff3f5e,0 0 0 16px #ff8c1a,0 0 0 24px #ffd400,0 0 0 32px #4ccf5b,0 0 0 40px #35b9ff,0 0 0 48px #7b4cff,0 0 0 56px #ff4db8;margin:8px}
header{background:#fff;padding:10px 16px 12px;border-bottom:4px solid #dad8e5;z-index:5}
.title{font-family:KAHomebody,cursive;font-size:clamp(32px,5.6vw,64px);text-align:center;line-height:1;margin:0 0 10px;color:#000;display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}.title .arcade{font-family:VAGRounded,Arial,sans-serif;color:var(--maroon);font-weight:900;letter-spacing:-1px}.title .bow{font-size:.9em}
.toolbar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.toolbar button{background:#f6f0eb;border:2px solid #dad7d2;border-radius:18px;padding:10px 18px;font-weight:900;color:#1f1a36;box-shadow:0 3px 8px rgba(0,0,0,.06);cursor:pointer}.toolbar button.primary{background:linear-gradient(#a71745,#861135);color:#fff;border-color:#6b0a27}.toolbar button:hover{transform:translateY(-1px)}
main{position:relative;min-height:0;overflow:hidden;background:#f1f1f4}
.screen{position:absolute;inset:0;display:none}.screen.active{display:block}
#home{overflow:auto;padding:18px 16px 22px}
.home-note{text-align:center;font-size:clamp(18px,2.3vw,34px);font-weight:900;margin:0 0 18px;color:#2a2550}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:1500px;margin:0 auto}
.game-card{position:relative;height:380px;border:0;border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--shadow);cursor:pointer;padding:0}.game-card:hover{transform:translateY(-2px)}
.card-bg{position:absolute;left:0;right:0;top:0;height:68%;background-size:cover;background-position:center}
.card-titlebar{position:absolute;left:0;right:0;bottom:0;height:32%;background:linear-gradient(#99133f,#7f102f);color:#fff;padding:14px 18px}
.card-title{font-family:KAHomebody,cursive;font-size:31px;line-height:1.02}
.card-desc{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;margin-top:8px}
.card-tag{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.96);border-radius:14px;padding:8px 14px;font-size:12px;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.card-target{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.97);border:2px solid #434343;border-radius:18px;padding:10px 10px 8px;width:116px;box-shadow:0 4px 10px rgba(0,0,0,.1);display:grid;place-items:center;text-align:center}.card-target img{max-width:82px;max-height:62px;object-fit:contain;display:block}.card-target .label{margin-top:2px;font-size:12px;font-weight:900;color:#111;text-transform:uppercase;line-height:1.1}
#gameScreen{background:#f1f1f4}
#topBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:8;background:#fff;border:3px solid #23203b;border-radius:18px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:96%;flex-wrap:wrap;justify-content:center}
#gameName{font-family:KAHomebody,cursive;font-size:30px;min-width:220px;text-align:center;color:#2d2554}.chip{background:#f4f4f7;border:2px solid #d2d1dd;padding:8px 12px;border-radius:14px;font-size:14px;font-weight:900}
#arenaWrap{position:absolute;inset:84px 10px 10px;display:grid;grid-template-rows:auto 1fr;gap:10px;min-height:0}
#clueBar{display:flex;justify-content:center;align-items:center;min-height:94px}.clue{display:flex;align-items:center;gap:16px;background:#fff;border:3px solid #222;padding:12px 16px;border-radius:18px;box-shadow:var(--shadow);max-width:min(980px,95%)}.clue-pic{width:88px;height:88px;background:#fff;border:2px solid #555;border-radius:18px;display:grid;place-items:center;flex:0 0 auto}.clue-pic img{max-width:70px;max-height:68px;object-fit:contain}.clue-text{display:flex;flex-direction:column;align-items:flex-start}.clue-kicker{font-size:12px;text-transform:uppercase;color:#625b85;font-weight:900;letter-spacing:.6px}.clue-main{font-size:clamp(19px,2vw,32px);font-weight:900;line-height:1.1}.clue-main b{color:#a30f41}
#arena{position:relative;min-height:0;overflow:hidden;background:#fff;border:4px solid #1b1630;border-radius:22px;box-shadow:var(--shadow)}#arena.bg-photo{background-size:cover;background-position:center}#arena:after{content:'';position:absolute;inset:0;border-radius:18px;pointer-events:none;box-shadow:inset 0 0 0 4px rgba(255,255,255,.3)}
#overlay{position:absolute;inset:0;background:rgba(255,255,255,.86);display:none;place-items:center;z-index:20}#overlay.active{display:grid}.overlay-card{width:min(560px,92%);background:#fff;border:4px solid #1b1630;border-radius:24px;padding:24px;text-align:center;box-shadow:0 14px 26px rgba(0,0,0,.14)}.overlay-title{font-family:KAHomebody,cursive;font-size:58px;color:#a10f40}.overlay-score{font-size:22px;font-weight:900;margin-top:6px}.overlay-sub{font-weight:900;color:#6a648e;margin-top:8px}.overlay-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.overlay-actions button{border:2px solid #d1d0db;border-radius:16px;padding:10px 16px;background:#f7f7f9;font-weight:900;cursor:pointer}
.photo-btn,.mystery,.tile{position:absolute;border:0;cursor:pointer;touch-action:manipulation}.photo-btn{width:94px;height:94px;border-radius:18px;background:rgba(255,255,255,.97);display:grid;place-items:center;box-shadow:0 8px 16px rgba(0,0,0,.15);transition:left .9s ease,top .9s ease,transform .12s ease}.photo-btn:active{transform:scale(.96)}.photo-btn img{max-width:80px;max-height:76px;object-fit:contain}
.tile{border-radius:18px;box-shadow:0 8px 14px rgba(0,0,0,.12);background:linear-gradient(145deg,#ff84bb,#ffd25b)}.tile:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.65) 0 6%,transparent 7%),radial-gradient(circle at 75% 30%,rgba(255,255,255,.45) 0 5%,transparent 6%),radial-gradient(circle at 45% 68%,rgba(255,255,255,.5) 0 4%,transparent 5%)}
.mystery{width:130px;height:130px;background:#fff;border:3px solid #222;border-radius:20px;display:grid;place-items:center;font-size:64px;font-weight:900;color:#9e1340;box-shadow:0 8px 14px rgba(0,0,0,.12)}.mystery.revealed img{max-width:98px;max-height:96px;object-fit:contain}.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:8px 14px;background:rgba(255,255,255,.96);border:2px solid #ddd;border-radius:999px;font-size:12px;font-weight:900}
.flash-msg{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #d2d1dd;padding:10px 16px;border-radius:999px;box-shadow:0 6px 16px rgba(58,56,108,.16);font-weight:900;color:#2f8151;opacity:0;transition:.18s;z-index:15}.flash-msg.show{opacity:1}.sparkle{position:absolute;pointer-events:none;font-size:22px;animation:spark .7s forwards}@keyframes spark{0%{transform:scale(.4);opacity:0}45%{opacity:1}100%{transform:translateY(-40px) scale(1.2);opacity:0}}
@media(max-width:1200px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.game-card{height:340px}}
@media(max-width:740px){#app{margin:2px;box-shadow:0 0 0 4px #ff3f5e,0 0 0 8px #ff8c1a,0 0 0 12px #ffd400,0 0 0 16px #4ccf5b,0 0 0 20px #35b9ff,0 0 0 24px #7b4cff,0 0 0 28px #ff4db8}.title{font-size:30px}.grid{grid-template-columns:1fr}.game-card{height:300px}.card-title{font-size:26px}.card-target{width:100px}.photo-btn{width:84px;height:84px}.photo-btn img{max-width:70px;max-height:66px}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="title"><span class="bow">🎀</span><span>Ms. Kaple's</span><span class="arcade">Double-Click Arcade</span><span class="bow">🎀</span></div>
  <div class="toolbar">
    <button class="primary" onclick="showHome()">🏠 GAMES</button>
    <button onclick="restartGame()">↻ RESTART</button>
    <button onclick="previousGame()">◀ PREV</button>
    <button onclick="nextGame()">NEXT ▶</button>
  </div>
</header>
<main>
  <section id="home" class="screen active">
    <p class="home-note">Every game uses a real DOUBLE-CLICK. Try to beat your highest score!</p>
    <div class="grid" id="gameGrid"></div>
  </section>
  <section id="gameScreen" class="screen">
    <div id="topBar">
      <div id="gameName">Game</div>
      <div class="chip">Score: <span id="score">0</span></div>
      <div class="chip">Best: <span id="best">0</span></div>
      <div id="roundChip" class="chip">Round: <span id="round">1</span>/<span id="roundTotal">1</span></div>
    </div>
    <div id="arenaWrap">
      <div id="clueBar"></div>
      <div id="arena"><div id="flash" class="flash-msg">Nice!</div></div>
    </div>
  </section>
  <div id="overlay"><div class="overlay-card"><div class="overlay-title" id="overlayTitle">YOU WIN!</div><div class="overlay-score" id="overlayScore">Final Score: 0</div><div class="overlay-sub" id="overlaySub">Try again to beat your score.</div><div class="overlay-actions"><button onclick="playAgain()">PLAY AGAIN</button><button onclick="showHome()">BACK TO GAMES</button><button onclick="nextGame()">NEXT GAME</button></div></div></div>
</main>
</div>
<script>
const LABELS={folder:'FOLDER',pencil:'PENCIL',wheel:'WHEEL',trophy:'TROPHY',shoe:'SHOE',waterbottle:'WATER BOTTLE',headphones:'HEADPHONES',backpack:'BACKPACK',notebook:'NOTEBOOK',calculator:'CALCULATOR',scissors:'SCISSORS',circuit:'CIRCUIT BOARD',screwdriver:'SCREWDRIVER',gear:'GEAR',stapler:'STAPLER',clip:'BINDER CLIP'};
const IMAGES={folder:'./obj_folder.png',pencil:'./obj_pencil.png',wheel:'./obj_wheel.png',trophy:'./obj_trophy.png',shoe:'./obj_shoe.png',waterbottle:'./obj_waterbottle.png',headphones:'./obj_headphones.png',backpack:'./obj_backpack.png',notebook:'./obj_notebook.png',calculator:'./obj_calculator.png',scissors:'./obj_scissors.png',circuit:'./obj_circuit.png',screwdriver:'./obj_screwdriver.png',gear:'./obj_gear.png',clip:'./obj_clip.png',stapler:'./obj_stapler.png'};
const REVEAL_IMAGES=['./reveal1.jpg','./reveal2.jpg','./reveal3.jpg','./reveal4.jpg','./reveal5.jpg','./reveal6.jpg'];
const GAMES=[
  {name:'Double-Click Challenge',tag:'Endless',desc:'Get the highest score!',type:'challenge',thumb:'./bg_challenge.jpg',hint:'stapler'},
  {name:'Reveal It!',tag:'4 Pictures',desc:'Uncover the hidden picture',type:'reveal',rounds:4,thumb:'./bg_reveal_card.jpg',hint:null},
  {name:'Open It!',tag:'5 Rounds',desc:'Double-click the correct icon',type:'open',rounds:5,thumb:'./bg_open.jpg',hint:'folder'},
  {name:'Double-Click Detective',tag:'4 Rounds',desc:'Find the picture in the scene',type:'detective',rounds:4,thumb:'./bg_detective.jpg',hint:'pencil'},
  {name:'Build It!',tag:'4 Parts',desc:'Build the robot piece by piece',type:'build',rounds:4,thumb:'./bg_build.jpg',hint:'wheel'},
  {name:'Double-Click Surprise',tag:'4 Rounds',desc:'Find the hidden trophy',type:'surprise',rounds:4,thumb:'./bg_surprise.jpg',hint:'trophy'},
  {name:'Clean It Up!',tag:'3 Rooms',desc:'Clean each whole room',type:'cleanup',rounds:3,thumb:'./bg_cleanup.jpg',hint:'shoe'},
  {name:'Collect Them All!',tag:'4 Rounds',desc:'Collect every matching picture',type:'collect',rounds:4,thumb:'./bg_collect.jpg',hint:'waterbottle'}
];
const home=document.getElementById('home'),gameScreen=document.getElementById('gameScreen'),gameGrid=document.getElementById('gameGrid'),gameNameEl=document.getElementById('gameName'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),roundEl=document.getElementById('round'),roundTotalEl=document.getElementById('roundTotal'),roundChip=document.getElementById('roundChip'),arena=document.getElementById('arena'),clueBar=document.getElementById('clueBar'),overlay=document.getElementById('overlay'),overlayTitle=document.getElementById('overlayTitle'),overlayScore=document.getElementById('overlayScore'),overlaySub=document.getElementById('overlaySub');
let currentGame=0,score=0,round=1,best=0,moveTimers=[],currentCleanupRemaining=0; let bestScores=JSON.parse(localStorage.getItem('msKapleArcadeBestQuick')||'{}');
function labelFor(type){return LABELS[type]||type.toUpperCase();}
function rand(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5);}
function saveBest(){bestScores[GAMES[currentGame].type]=best;localStorage.setItem('msKapleArcadeBestQuick',JSON.stringify(bestScores));}
function currentBest(){return Number(bestScores[GAMES[currentGame].type]||0);}
function updateHUD(){const g=GAMES[currentGame];gameNameEl.textContent=g.name;scoreEl.textContent=score;bestEl.textContent=best;roundEl.textContent=round;roundTotalEl.textContent=g.rounds||'∞';roundChip.style.display=g.type==='challenge'?'none':'block';}
function clearArena(){moveTimers.forEach(clearInterval);moveTimers.forEach(clearTimeout);moveTimers=[];arena.className='';arena.style.backgroundImage='';arena.innerHTML='<div id="flash" class="flash-msg">Nice!</div>';clueBar.innerHTML='';}
function flashMsg(t='Nice!'){const f=document.getElementById('flash');if(!f)return;f.textContent=t;f.classList.add('show');clearTimeout(window.flashTimer);window.flashTimer=setTimeout(()=>f.classList.remove('show'),560);}
function sparkleAt(x,y){const s=document.createElement('div');s.className='sparkle';s.textContent='✦';s.style.left=x+'px';s.style.top=y+'px';s.style.color=rand(['#ff4da8','#ffd64a','#5dc0ff','#74d66c']);arena.appendChild(s);setTimeout(()=>s.remove(),700);}
function showHome(){overlay.classList.remove('active');clearArena();gameScreen.classList.remove('active');home.classList.add('active');}
function startGame(index){overlay.classList.remove('active');currentGame=(index+GAMES.length)%GAMES.length;score=0;round=1;best=currentBest();home.classList.remove('active');gameScreen.classList.add('active');updateHUD();setupRound();}
function restartGame(){if(!gameScreen.classList.contains('active'))return;overlay.classList.remove('active');score=0;round=1;best=currentBest();updateHUD();setupRound();}
function previousGame(){startGame(currentGame-1);}function nextGame(){startGame(currentGame+1);}function playAgain(){startGame(currentGame);}
function addScore(n=1){score+=n;if(score>best){best=score;saveBest();}updateHUD();}
function randomPos(w,h=w,pad=12){const r=arena.getBoundingClientRect();return{x:pad+Math.random()*Math.max(1,r.width-w-pad*2),y:pad+Math.random()*Math.max(1,r.height-h-pad*2)}}
function setClue(kicker,main,objType){const pic=objType?`<div class="clue-pic"><img src="${IMAGES[objType]}" alt="${labelFor(objType)}"></div>`:'';clueBar.innerHTML=`<div class="clue">${pic}<div class="clue-text"><div class="clue-kicker">${kicker}</div><div class="clue-main">${main}</div></div></div>`;}
function createPhotoButton(type,cls='photo-btn',size=94){const b=document.createElement('button');b.className=cls;b.style.width=size+'px';b.style.height=size+'px';b.innerHTML=`<img src="${IMAGES[type]}" alt="${labelFor(type)}">`;b.addEventListener('click',e=>e.preventDefault());return b;}
function shake(el){el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:220});flashMsg('Try again!');}
function showWin(title='YOU WIN!',sub='Try again to beat your highest score.'){if(score>best){best=score;saveBest();updateHUD();}overlayTitle.textContent=title;overlayScore.textContent='Final Score: '+score;overlaySub.textContent=sub;overlay.classList.add('active');}
function maybeNextRound(msg='Great job!'){flashMsg(msg);if(round>=(GAMES[currentGame].rounds||999999)){setTimeout(()=>showWin('YOU WIN!','Great work! See if you can beat that score next time.'),500);}else{round++;updateHUD();setTimeout(setupRound,540);}}
function placeButtons(types,positions,size=94,cls='photo-btn',parent=arena){return types.map((type,i)=>{const b=createPhotoButton(type,cls,size);const pos=positions?positions[i]:randomPos(size);if(pos.x!==undefined){b.style.left=pos.x+'px';b.style.top=pos.y+'px';}else{b.style.left=pos[0]+'%';b.style.top=pos[1]+'%';}parent.appendChild(b);b.dataset.type=type;return b;});}
function setupRound(){clearArena();updateHUD();const t=GAMES[currentGame].type;if(t==='challenge')setupChallenge();if(t==='reveal')setupReveal();if(t==='open')setupOpen();if(t==='detective')setupDetective();if(t==='build')setupBuild();if(t==='surprise')setupSurprise();if(t==='cleanup')setupCleanup();if(t==='collect')setupCollect();}
function setupChallenge(){arena.classList.add('bg-photo');arena.style.backgroundImage="url('./bg_challenge.jpg')";const target=rand(['stapler','clip','pencil','scissors']);setClue('Double-click this picture',`Find <b>${labelFor(target)}</b>`,target);const types=shuffle([target,...shuffle(['stapler','clip','pencil','scissors'].filter(x=>x!==target)).slice(0,2)]);const buttons=placeButtons(types,null,100);buttons.forEach(btn=>btn.addEventListener('dblclick',e=>{e.preventDefault();const rect=btn.getBoundingClientRect(),aRect=arena.getBoundingClientRect();sparkleAt(rect.left-aRect.left+30,rect.top-aRect.top+20);if(btn.dataset.type===target){addScore(1);flashMsg('Great double-click!');setupChallenge();}else shake(btn);}));const speed=Math.max(950,1450-Math.min(score*16,500));moveTimers.push(setInterval(()=>buttons.forEach(btn=>{const p=randomPos(100);btn.style.left=p.x+'px';btn.style.top=p.y+'px';}),speed));const hint=document.createElement('div');hint.className='hint';hint.textContent='Endless game: try to beat your best score!';arena.appendChild(hint);}
function setupReveal(){arena.classList.add('bg-photo');arena.style.backgroundImage=`url('${REVEAL_IMAGES[(round-1)%REVEAL_IMAGES.length]}')`;setClue('Reveal the hidden picture','Double-click every tile to uncover the <b>PICTURE</b>',null);const cols=4,rows=3,gap=10;let remaining=cols*rows;requestAnimationFrame(()=>{const rect=arena.getBoundingClientRect(),tw=(rect.width-gap*(cols+1))/cols,th=(rect.height-gap*(rows+1))/rows;const colors=['#ff9ecb','#ffd56f','#7bd5ff','#a6eb80','#b197ff','#ffae75'];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const tile=document.createElement('button');tile.className='tile';tile.style.left=(gap+c*(tw+gap))+'px';tile.style.top=(gap+r*(th+gap))+'px';tile.style.width=tw+'px';tile.style.height=th+'px';tile.style.background='linear-gradient(145deg,'+colors[(r*cols+c)%colors.length]+',#ffffff)';tile.addEventListener('click',e=>e.preventDefault());tile.addEventListener('dblclick',e=>{e.preventDefault();tile.style.transform='scale(.12) rotate(8deg)';tile.style.opacity='0';setTimeout(()=>tile.remove(),180);remaining--;addScore(1);if(remaining===0)maybeNextRound('Picture revealed!');});arena.appendChild(tile);}});} 
function setupOpen(){arena.classList.add('bg-photo');arena.style.backgroundImage="url('./bg_open.jpg')";const pool=['folder','backpack','notebook','calculator','headphones'];const target=rand(pool);setClue('Double-click this picture',`Find <b>${labelFor(target)}</b>`,target);const pos=[[10,18],[28,55],[48,18],[67,54],[82,20]];const buttons=placeButtons(shuffle(pool),pos,96);buttons.forEach(btn=>btn.addEventListener('dblclick',e=>{e.preventDefault();if(btn.dataset.type===target){addScore(2);maybeNextRound('Opened it!');}else shake(btn);}));}
function setupDetective(){arena.classList.add('bg-photo');arena.style.backgroundImage="url('./bg_detective.jpg')";const items=['pencil','notebook','waterbottle','headphones','calculator'];const target=rand(items);setClue('Double-click this picture',`Find <b>${labelFor(target)}</b>`,target);const pos=[[14,25],[30,59],[52,26],[72,62],[84,24]];const buttons=placeButtons(items,pos,92);buttons.forEach(btn=>btn.addEventListener('dblclick',e=>{e.preventDefault();if(btn.dataset.type===target){addScore(2);maybeNextRound('You found it!');}else shake(btn);}));}
function setupBuild(){arena.classList.add('bg-photo');arena.style.backgroundImage="url('./bg_build.jpg')";const steps=['wheel','circuit','gear','screwdriver'];const target=steps[round-1];setClue('Double-click this part',`Build with <b>${labelFor(target)}</b>`,target);const pos=[[12,12],[24,68],[42,80],[68,73]];const buttons=placeButtons(shuffle(steps),[[14,16],[28,68],[52,16],[76,68]],96);buttons.forEach(btn=>btn.addEventListener('dblclick',e=>{e.preventDefault();if(btn.dataset.type===target){addScore(2);maybeNextRound('Part added!');}else shake(btn);}));const hint=document.createElement('div');hint.className='hint';hint.textContent='Pick the real robot part shown in the clue card.';arena.appendChild(hint);}
function setupSurprise(){arena.classList.add('bg-photo');arena.style.backgroundImage="url('./bg_surprise.jpg')";setClue('Double-click the boxes','Find the hidden <b>TROPHY</b>', 'trophy');const prizes=shuffle(['trophy','headphones','backpack','folder','shoe','calculator']);const pos=[[10,18],[38,16],[70,18],[12,58],[42,58],[72,58]];prizes.forEach((type,i)=>{const b=document.createElement('button');b.className='mystery';b.style.left=pos[i][0]+'%';b.style.top=pos[i][1]+'%';b.textContent='?';b.addEventListener('click',e=>e.preventDefault());b.addEventListener('dblclick',e=>{e.preventDefault();if(b.classList.contains('revealed'))return;b.classList.add('revealed');b.innerHTML=`<img src="${IMAGES[type]}" alt="${labelFor(type)}">`;addScore(1);if(type==='trophy')setTimeout(()=>maybeNextRound('You found the trophy!'),320);});arena.appendChild(b);});}
function setupCleanup(){arena.classList.add('bg-photo');arena.style.backgroundImage="url('./bg_cleanup.jpg')";const rooms=[['shoe','backpack','waterbottle','notebook'],['shoe','backpack','calculator','headphones'],['shoe','backpack','notebook','waterbottle']];const types=rooms[(round-1)%rooms.length];setClue('Clean the whole room','Double-click each picture until the room is clean.',types[0]);const pos=[[18,68],[4,56],[79,67],[62,78]];let remaining=types.length;const buttons=placeButtons(types,pos,96);buttons.forEach(btn=>btn.addEventListener('dblclick',e=>{e.preventDefault();const rect=btn.getBoundingClientRect(),aRect=arena.getBoundingClientRect();sparkleAt(rect.left-aRect.left+30,rect.top-aRect.top+20);btn.remove();remaining--;addScore(1);if(remaining===0)maybeNextRound('Room cleaned!');}));}
function setupCollect(){arena.classList.add('bg-photo');arena.style.backgroundImage="url('./bg_collect.jpg')";const rounds=[{target:'waterbottle',all:['waterbottle','waterbottle','headphones','notebook','backpack','calculator','scissors']},{target:'headphones',all:['headphones','headphones','notebook','backpack','calculator','waterbottle','scissors']},{target:'backpack',all:['backpack','backpack','notebook','calculator','waterbottle','headphones','scissors']},{target:'notebook',all:['notebook','notebook','calculator','waterbottle','headphones','backpack','scissors']}];const data=rounds[round-1];setClue('Collect them all',`Double-click every <b>${labelFor(data.target)}</b>`,data.target);const pos=[[8,18],[24,60],[40,20],[54,60],[68,18],[78,48],[88,20]];let remaining=data.all.filter(x=>x===data.target).length;const buttons=placeButtons(data.all,pos,90);buttons.forEach(btn=>btn.addEventListener('dblclick',e=>{e.preventDefault();if(btn.dataset.type===data.target){btn.remove();remaining--;addScore(1);if(remaining===0)maybeNextRound('You collected them all!');}else shake(btn);}));}
GAMES.forEach((g,i)=>{const card=document.createElement('button');card.className='game-card';const targetHTML=g.hint?`<div class="card-target"><img src="${IMAGES[g.hint]}" alt="${g.hint}"><div class="label">${labelFor(g.hint)}</div></div>`:'';card.innerHTML=`<div class="card-bg" style="background-image:url('${g.thumb}')"></div><div class="card-tag">${g.tag}</div>${targetHTML}<div class="card-titlebar"><div class="card-title">${g.name}</div><div class="card-desc">${g.desc}</div></div>`;card.addEventListener('click',()=>startGame(i));gameGrid.appendChild(card);});
window.addEventListener('resize',()=>{if(gameScreen.classList.contains('active')&&!overlay.classList.contains('active'))setupRound();});
</script>
