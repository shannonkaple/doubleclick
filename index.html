<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ms. Kaple's Double-Click Arcade</title>
<style>
:root{--ink:#22314a;--purple:#7c3aed;--pink:#ec4899;--orange:#f97316;--yellow:#facc15;--green:#22c55e;--blue:#3b82f6}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:#f8fbff;user-select:none}body{overflow:hidden}button{font:inherit}
#app{height:100vh;display:grid;grid-template-rows:auto 1fr}header{background:#fff;border-bottom:5px solid #e9e4ff;padding:10px 14px;box-shadow:0 3px 12px rgba(31,41,55,.08);z-index:20}.title{text-align:center;font-size:clamp(25px,4vw,42px);font-weight:1000;margin-bottom:8px}.rainbow-word{background:linear-gradient(90deg,#ef4444,#f97316,#eab308,#22c55e,#3b82f6,#7c3aed,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}.toolbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.toolbar button{border:0;border-radius:999px;padding:8px 14px;font-weight:900;cursor:pointer;background:#f3f4f6;color:#111827}.toolbar button:hover{transform:translateY(-1px)}main{position:relative;min-height:0;overflow:hidden}.screen{position:absolute;inset:0;display:none}.screen.active{display:block}
#home{overflow:auto;padding:20px;background:radial-gradient(circle at 10% 20%,#ffe1ef 0 7%,transparent 7.2%),radial-gradient(circle at 88% 18%,#fff3a8 0 6%,transparent 6.2%),radial-gradient(circle at 20% 86%,#d7f7df 0 7%,transparent 7.2%),radial-gradient(circle at 82% 82%,#dbeafe 0 8%,transparent 8.2%),linear-gradient(180deg,#f8f7ff,#f3fdff)}.home-note{text-align:center;font-size:clamp(17px,2vw,22px);font-weight:900;margin:0 0 17px}.grid{max-width:1120px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.game-card{position:relative;border:4px solid transparent;background:#fff;border-radius:24px;padding:18px 14px;min-height:158px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.10);text-align:center;transition:.15s;overflow:hidden}.game-card:before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:var(--stripe,#7c3aed)}.game-card:hover{transform:translateY(-4px);border-color:#ddd6fe}.game-card .icon{font-size:58px;display:block;margin:2px 0 8px}.game-card .name{font-size:21px;font-weight:1000}.game-card .desc{font-size:14px;font-weight:800;opacity:.68;margin-top:5px}
#gameScreen{background:linear-gradient(180deg,#fafaff,#edfaff)}.game-top{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:8;background:rgba(255,255,255,.96);padding:8px 13px;border-radius:18px;box-shadow:0 5px 15px rgba(0,0,0,.08);font-weight:1000;white-space:nowrap}#gameName{min-width:180px;text-align:center}.stat{background:#f3f4f6;border-radius:999px;padding:6px 10px}#instruction{position:absolute;left:50%;top:68px;transform:translateX(-50%);z-index:7;font-size:clamp(16px,2.25vw,24px);font-weight:1000;text-align:center;background:#fff;padding:8px 14px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.07);max-width:90%;white-space:nowrap}#arena{position:absolute;inset:112px 10px 10px;border-radius:24px;background:rgba(255,255,255,.78);overflow:hidden;border:3px dashed rgba(124,58,237,.18)}#message{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:#fff;border:3px solid #bbf7d0;color:#166534;font-weight:1000;padding:10px 18px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.08);opacity:0;transition:.15s;z-index:30;pointer-events:none}#message.show{opacity:1}.big-center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.big-center span{font-size:clamp(50px,9vw,118px);font-weight:1000;opacity:.04}
.item{position:absolute;display:grid;place-items:center;border:0;background:#fff;cursor:pointer;border-radius:22px;box-shadow:0 7px 18px rgba(0,0,0,.14);outline:4px solid rgba(124,58,237,.08);touch-action:manipulation;transition:left .16s,top .16s,transform .08s,width .16s,height .16s}.item:active{transform:scale(.96)}.tile{position:absolute;border:0;border-radius:14px;cursor:pointer;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 4px 8px rgba(0,0,0,.08);transition:.2s;touch-action:manipulation}.reveal-art{position:absolute;inset:8%;display:grid;place-items:center;border-radius:26px;background:linear-gradient(145deg,#dbeafe,#fce7f3,#fef3c7);font-size:min(30vw,220px)}
.desktop{position:absolute;inset:4%;border-radius:26px;background:linear-gradient(#77d0ff,#c5f0ff 62%,#84d473 62%);overflow:hidden;border:5px solid #334155}.desktop:after{content:"";position:absolute;left:0;right:0;bottom:0;height:44px;background:rgba(31,41,55,.84)}.desktop-icon{position:absolute;width:108px;height:112px;border:0;background:rgba(255,255,255,.86);border-radius:18px;display:grid;place-items:center;cursor:pointer;font-size:54px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.15);touch-action:manipulation}.desktop-icon small{display:block;font-size:13px;margin-top:-18px;padding:0 4px}.open-window{position:absolute;inset:13%;z-index:5;background:#fff;border-radius:24px;border:5px solid #334155;box-shadow:0 14px 35px rgba(0,0,0,.25);display:grid;place-items:center;text-align:center;padding:20px;font-size:clamp(28px,7vw,72px);font-weight:1000}
.scene{position:absolute;inset:4%;border-radius:28px;overflow:hidden;background:linear-gradient(#c7ecff 0 58%,#c9efad 58%);border:4px solid #cbd5e1}.scene-obj{position:absolute;border:0;background:transparent;font-size:clamp(42px,7vw,82px);cursor:pointer;filter:drop-shadow(0 4px 2px rgba(0,0,0,.15));touch-action:manipulation}
.build-board{position:absolute;inset:4%;display:grid;grid-template-columns:1fr 1.5fr;gap:16px}.parts{border-radius:24px;background:#f8fafc;border:4px dashed #cbd5e1;padding:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:center}.part{min-height:82px;border:0;border-radius:18px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.10);font-size:44px;cursor:pointer;touch-action:manipulation}.build-stage{border-radius:24px;background:linear-gradient(#dbeafe,#fef3c7);border:4px solid #cbd5e1;display:grid;place-items:center;position:relative}.robot{width:min(46vh,330px);height:min(46vh,330px);position:relative}.robot-body{position:absolute;width:42%;height:42%;left:29%;top:38%;background:#a78bfa;border:5px solid #4c1d95;border-radius:22px}.robot-head{position:absolute;width:48%;height:32%;left:26%;top:7%;background:#c4b5fd;border:5px solid #4c1d95;border-radius:26px}.robot-eye{position:absolute;width:11%;height:11%;top:18%;background:#fff;border:4px solid #1f2937;border-radius:50%;opacity:.08}.robot-eye.left{left:36%}.robot-eye.right{right:36%}.robot-mouth{position:absolute;left:39%;top:29%;width:22%;height:7%;border-radius:999px;background:#1f2937;opacity:.08}.robot-arm{position:absolute;top:45%;width:15%;height:9%;background:#93c5fd;border:4px solid #1e3a8a;border-radius:999px;opacity:.08}.robot-arm.left{left:14%;transform:rotate(15deg)}.robot-arm.right{right:14%;transform:rotate(-15deg)}.robot-leg{position:absolute;top:78%;width:10%;height:17%;background:#fdba74;border:4px solid #9a3412;border-radius:10px;opacity:.08}.robot-leg.left{left:35%}.robot-leg.right{right:35%}.robot .placed{opacity:1!important}
.mystery-grid{position:absolute;inset:5%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:14px}.mystery{border:0;border-radius:24px;background:linear-gradient(145deg,#a78bfa,#7c3aed);color:#fff;font-size:74px;cursor:pointer;box-shadow:0 8px 18px rgba(76,29,149,.25);touch-action:manipulation}.mystery.revealed{background:#fff;color:#111827;border:5px solid #ddd6fe}
.cleanup-room{position:absolute;inset:4%;border-radius:28px;overflow:hidden;background:linear-gradient(#d9f1ff 0 62%,#e9c891 62%);border:4px solid #cbd5e1}.room-table{position:absolute;left:20%;right:20%;bottom:11%;height:24%;background:#b8793d;border:5px solid #75401d;border-radius:20px}.clean-item{position:absolute;border:0;background:transparent;font-size:62px;cursor:pointer;filter:drop-shadow(0 4px 2px rgba(0,0,0,.14));touch-action:manipulation}.bin{position:absolute;right:3%;bottom:5%;font-size:96px;opacity:.78}.single-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;font-weight:900;background:rgba(255,255,255,.9);border-radius:999px;padding:7px 13px;font-size:13px;opacity:.75}.spark{position:absolute;pointer-events:none;font-size:28px;animation:pop .65s forwards;z-index:40}@keyframes pop{0%{transform:scale(.4);opacity:0}40%{opacity:1}100%{transform:translateY(-45px) scale(1.4);opacity:0}}
@media(max-width:700px){.title{font-size:25px}.toolbar button{padding:7px 9px}.game-top{gap:5px;font-size:13px}#gameName{min-width:115px}.stat{padding:5px 7px}#arena{inset:116px 7px 7px}#instruction{top:70px;white-space:normal}.build-board{grid-template-columns:.9fr 1.4fr;gap:8px}.parts{padding:7px;gap:6px}}
</style>
</head>
<body>
<div id="app"><header><div class="title">Ms. Kaple's <span class="rainbow-word">Double-Click Arcade</span></div><div class="toolbar"><button onclick="showHome()">🎮 GAMES</button><button onclick="restartGame()">↻ RESTART</button><button onclick="previousGame()">◀ PREV</button><button onclick="nextGame()">NEXT ▶</button></div></header><main><section id="home" class="screen active"><p class="home-note">Choose a game. Every game uses a <strong>DOUBLE-CLICK!</strong></p><div class="grid" id="gameGrid"></div></section><section id="gameScreen" class="screen"><div class="game-top"><span id="gameName">Game</span><span class="stat">Score: <span id="score">0</span></span><span class="stat">Level: <span id="level">1</span></span></div><div id="instruction">Double-click!</div><div id="arena"><div class="big-center"><span>DOUBLE-CLICK!</span></div></div><div id="message">Great double-click! ⭐</div></section></main></div>
<script>
const GAME_LIST=[
{name:"Double-Click Challenge",icon:"⭐",desc:"Catch the moving emoji",type:"challenge",stripe:"#7c3aed"},
{name:"Reveal It!",icon:"🖼️",desc:"Uncover the hidden picture",type:"reveal",stripe:"#ec4899"},
{name:"Open It!",icon:"📁",desc:"Open the right file or folder",type:"open",stripe:"#f97316"},
{name:"Double-Click Detective",icon:"🔎",desc:"Find the object in the scene",type:"detective",stripe:"#eab308"},
{name:"Build It!",icon:"🤖",desc:"Build a robot piece by piece",type:"build",stripe:"#22c55e"},
{name:"Double-Click Surprise",icon:"🎁",desc:"Find the hidden trophy",type:"surprise",stripe:"#3b82f6"},
{name:"Clean It Up!",icon:"🧹",desc:"Clear the messy classroom",type:"cleanup",stripe:"#8b5cf6"}
];
const EMOJIS=["⭐","🐾","🌈","🚀","🦄","🐸","🍎","⚽","🎈","🐝","🦋","🍕","🐙","🌻","🐢","🍓","☀️","🎨","🧩","🐬","👑","🍪","🪁","🐳","🦖","🐧","🍉","🛸","🏀","🎯"];
const REVEALS=["🦁","🐼","🦄","🚀","🌈","🐙","🦖","🍉","🐸","🎨","🐳","🏰"];
const DESKTOP_ITEMS=[{emoji:"📁",name:"Purple Folder"},{emoji:"🖼️",name:"Picture"},{emoji:"📄",name:"Story"},{emoji:"🎵",name:"Music"},{emoji:"🎮",name:"Game"},{emoji:"📚",name:"Books"},{emoji:"🌟",name:"Star File"},{emoji:"🧩",name:"Puzzle"}];
const DETECTIVE_OBJS=["🎒","✏️","📘","🧃","⚽","🧸","🍎","🖍️","🔑","🎧"];
const CLEANUP_ITEMS=["✏️","🖍️","📘","📄","🧃","🍎","🧸","🎨","📏","✂️"];
const arena=document.getElementById("arena"),home=document.getElementById("home"),gameScreen=document.getElementById("gameScreen"),gameGrid=document.getElementById("gameGrid"),scoreEl=document.getElementById("score"),levelEl=document.getElementById("level"),gameNameEl=document.getElementById("gameName"),instructionEl=document.getElementById("instruction"),message=document.getElementById("message");
let currentGame=0,score=0,level=1,timer=null,roundState={};
GAME_LIST.forEach((g,i)=>{const b=document.createElement("button");b.className="game-card";b.style.setProperty("--stripe",g.stripe);b.innerHTML=`<span class="icon">${g.icon}</span><div class="name">${g.name}</div><div class="desc">${g.desc}</div>`;b.onclick=()=>startGame(i);gameGrid.appendChild(b)});
function rand(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function updateStats(){scoreEl.textContent=score;levelEl.textContent=level;gameNameEl.textContent=GAME_LIST[currentGame].name}function clearArena(){if(timer){clearTimeout(timer);timer=null}arena.innerHTML='<div class="big-center"><span>DOUBLE-CLICK!</span></div>';roundState={}}function showHome(){clearArena();gameScreen.classList.remove("active");home.classList.add("active")}function startGame(i){currentGame=(i+GAME_LIST.length)%GAME_LIST.length;score=0;level=1;home.classList.remove("active");gameScreen.classList.add("active");updateStats();setupRound()}function restartGame(){if(!gameScreen.classList.contains("active"))return;score=0;level=1;updateStats();setupRound()}function previousGame(){startGame(currentGame-1)}function nextGame(){startGame(currentGame+1)}
function celebrate(text){message.textContent=text||rand(["Great double-click! ⭐","Nice job! 🎉","You got it! 🌈","Awesome! 🐾","Keep going! 🚀"]);message.classList.add("show");clearTimeout(window.msgTimer);window.msgTimer=setTimeout(()=>message.classList.remove("show"),600);for(let i=0;i<7;i++){const s=document.createElement("div");s.className="spark";s.textContent=rand(["⭐","✨","🌈","🎉"]);s.style.left=(42+Math.random()*16)+"%";s.style.top=(38+Math.random()*18)+"%";arena.appendChild(s);setTimeout(()=>s.remove(),700)}}
function wrong(el){el.animate([{transform:"translateX(0)"},{transform:"translateX(-7px)"},{transform:"translateX(7px)"},{transform:"translateX(0)"}],{duration:220});message.textContent="Try a DOUBLE-click!";message.classList.add("show");clearTimeout(window.msgTimer);window.msgTimer=setTimeout(()=>message.classList.remove("show"),450)}function scorePoint(text){score++;level++;updateStats();celebrate(text);setTimeout(setupRound,180)}function blockSingleClick(el){el.addEventListener("click",e=>e.preventDefault())}function randomPos(sx,sy=sx,pad=12){const w=Math.max(40,arena.clientWidth),h=Math.max(40,arena.clientHeight);return{x:pad+Math.random()*Math.max(1,w-sx-pad*2),y:pad+Math.random()*Math.max(1,h-sy-pad*2)}}function createItem(content,size=100){const b=document.createElement("button");b.className="item";b.style.width=size+"px";b.style.height=size+"px";b.style.fontSize=(size*.62)+"px";const p=randomPos(size);b.style.left=p.x+"px";b.style.top=p.y+"px";b.innerHTML=content;blockSingleClick(b);arena.appendChild(b);return b}
function setupRound(){clearArena();updateStats();const t=GAME_LIST[currentGame].type;if(t==="challenge")setupChallenge();if(t==="reveal")setupReveal();if(t==="open")setupOpen();if(t==="detective")setupDetective();if(t==="build")setupBuild();if(t==="surprise")setupSurprise();if(t==="cleanup")setupCleanup()}
function setupChallenge(){instructionEl.textContent="Find the emoji and DOUBLE-CLICK it!";const size=Math.max(58,110-Math.floor((level-1)/3)*4);const b=createItem(rand(EMOJIS),size);b.addEventListener("dblclick",e=>{e.preventDefault();scorePoint(level%10===0?"WOW! Keep going! 🎉":"Great double-click! ⭐")})}
function setupReveal(){instructionEl.textContent="DOUBLE-CLICK the tiles to reveal the picture!";const art=document.createElement("div");art.className="reveal-art";art.textContent=rand(REVEALS);arena.appendChild(art);const cols=4,rows=3,total=cols*rows,gap=4;roundState.remaining=total;requestAnimationFrame(()=>{const W=arena.clientWidth,H=arena.clientHeight,tw=(W-(cols+1)*gap)/cols,th=(H-(rows+1)*gap)/rows,colors=["#fb7185","#fb923c","#facc15","#4ade80","#60a5fa","#a78bfa","#f472b6"];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const t=document.createElement("button");t.className="tile";t.style.left=(gap+c*(tw+gap))+"px";t.style.top=(gap+r*(th+gap))+"px";t.style.width=tw+"px";t.style.height=th+"px";t.style.background=colors[(r*cols+c)%colors.length];blockSingleClick(t);t.addEventListener("dblclick",e=>{e.preventDefault();if(t.dataset.done)return;t.dataset.done="1";t.style.transform="scale(.15) rotate(8deg)";t.style.opacity="0";setTimeout(()=>t.remove(),180);roundState.remaining--;score++;scoreEl.textContent=score;if(roundState.remaining===0){level++;levelEl.textContent=level;celebrate("Picture revealed! 🖼️");setTimeout(setupRound,750)}});arena.appendChild(t)}})}
function setupOpen(){const target=rand(DESKTOP_ITEMS);instructionEl.textContent=`DOUBLE-CLICK to open: ${target.name}`;const desk=document.createElement("div");desk.className="desktop";arena.appendChild(desk);const choices=shuffle([target,...shuffle(DESKTOP_ITEMS.filter(x=>x!==target)).slice(0,5)]),spots=[[7,10],[39,9],[71,11],[10,48],[42,47],[72,47]];choices.forEach((it,i)=>{const b=document.createElement("button");b.className="desktop-icon";b.style.left=spots[i][0]+"%";b.style.top=spots[i][1]+"%";b.innerHTML=`<span>${it.emoji}</span><small>${it.name}</small>`;blockSingleClick(b);b.addEventListener("dblclick",e=>{e.preventDefault();if(it!==target){wrong(b);return}const win=document.createElement("div");win.className="open-window";win.innerHTML=`<div>${it.emoji}<br><span style="font-size:.38em">${it.name} OPENED!</span></div>`;desk.appendChild(win);score++;level++;updateStats();celebrate("You opened it! 📂");setTimeout(setupRound,750)});desk.appendChild(b)})}
function setupDetective(){const target=rand(DETECTIVE_OBJS);instructionEl.textContent=`Detective! DOUBLE-CLICK ${target}`;const scene=document.createElement("div");scene.className="scene";arena.appendChild(scene);const decor=document.createElement("div");decor.style.cssText="position:absolute;inset:0;pointer-events:none;font-size:70px";decor.innerHTML='<span style="position:absolute;left:8%;top:8%">☁️</span><span style="position:absolute;right:12%;top:14%">☁️</span><span style="position:absolute;right:4%;bottom:7%">🌳</span><span style="position:absolute;left:3%;bottom:4%">🌼</span>';scene.appendChild(decor);const picks=shuffle([target,...shuffle(DETECTIVE_OBJS.filter(x=>x!==target)).slice(0,7)]),spots=[[10,30],[30,20],[52,30],[74,22],[15,66],[36,60],[59,67],[79,60]];picks.forEach((obj,i)=>{const b=document.createElement("button");b.className="scene-obj";b.textContent=obj;b.style.left=spots[i][0]+"%";b.style.top=spots[i][1]+"%";blockSingleClick(b);b.addEventListener("dblclick",e=>{e.preventDefault();obj===target?scorePoint("Detective found it! 🔎"):wrong(b)});scene.appendChild(b)})}
function setupBuild(){const steps=[{name:"eyes",emoji:"👀",selector:[".robot-eye.left",".robot-eye.right"]},{name:"mouth",emoji:"😁",selector:[".robot-mouth"]},{name:"arms",emoji:"💪",selector:[".robot-arm.left",".robot-arm.right"]},{name:"legs",emoji:"🦿",selector:[".robot-leg.left",".robot-leg.right"]}],step=(level-1)%steps.length,target=steps[step];instructionEl.textContent=`DOUBLE-CLICK the ${target.name} to add them!`;const board=document.createElement("div");board.className="build-board";arena.appendChild(board);const parts=document.createElement("div");parts.className="parts";const stage=document.createElement("div");stage.className="build-stage";board.append(parts,stage);const robot=document.createElement("div");robot.className="robot";robot.innerHTML='<div class="robot-head"></div><div class="robot-eye left"></div><div class="robot-eye right"></div><div class="robot-mouth"></div><div class="robot-body"></div><div class="robot-arm left"></div><div class="robot-arm right"></div><div class="robot-leg left"></div><div class="robot-leg right"></div>';stage.appendChild(robot);for(let i=0;i<step;i++)steps[i].selector.forEach(sel=>robot.querySelector(sel)?.classList.add("placed"));shuffle(steps).forEach(ch=>{const b=document.createElement("button");b.className="part";b.textContent=ch.emoji;blockSingleClick(b);b.addEventListener("dblclick",e=>{e.preventDefault();if(ch!==target){wrong(b);return}target.selector.forEach(sel=>robot.querySelector(sel)?.classList.add("placed"));score++;level++;updateStats();celebrate(target.name+" added! 🤖");setTimeout(setupRound,step===steps.length-1?900:600)});parts.appendChild(b)})}
function setupSurprise(){instructionEl.textContent="DOUBLE-CLICK the mystery boxes. Find the trophy! 🏆";const grid=document.createElement("div");grid.className="mystery-grid";arena.appendChild(grid);const prizes=shuffle(["🌟","🦄","🍕","🐸","🎈","🏆"]);let finished=false;prizes.forEach(p=>{const b=document.createElement("button");b.className="mystery";b.textContent="?";blockSingleClick(b);b.addEventListener("dblclick",e=>{e.preventDefault();if(b.dataset.done||finished)return;b.dataset.done="1";b.classList.add("revealed");b.textContent=p;score++;scoreEl.textContent=score;if(p==="🏆"){finished=true;level++;levelEl.textContent=level;celebrate("You found the trophy! 🏆");setTimeout(setupRound,800)}else{message.textContent="Keep looking! 👀";message.classList.add("show");clearTimeout(window.msgTimer);window.msgTimer=setTimeout(()=>message.classList.remove("show"),450)}});grid.appendChild(b)})}
function setupCleanup(){const target=rand(CLEANUP_ITEMS);instructionEl.textContent=`DOUBLE-CLICK ${target} to put it away!`;const room=document.createElement("div");room.className="cleanup-room";arena.appendChild(room);const table=document.createElement("div");table.className="room-table";room.appendChild(table);const bin=document.createElement("div");bin.className="bin";bin.textContent="🧺";room.appendChild(bin);const picks=shuffle([target,...shuffle(CLEANUP_ITEMS.filter(x=>x!==target)).slice(0,6)]),spots=[[10,17],[30,26],[54,14],[75,26],[20,58],[47,54],[70,59]];picks.forEach((obj,i)=>{const b=document.createElement("button");b.className="clean-item";b.textContent=obj;b.style.left=spots[i][0]+"%";b.style.top=spots[i][1]+"%";blockSingleClick(b);b.addEventListener("dblclick",e=>{e.preventDefault();if(obj!==target){wrong(b);return}b.animate([{transform:"scale(1)",opacity:1},{transform:"translate(280px,120px) scale(.2)",opacity:0}],{duration:380,fill:"forwards"});score++;level++;updateStats();celebrate("Put away! 🧹");setTimeout(setupRound,520)});room.appendChild(b)});const hint=document.createElement("div");hint.className="single-hint";hint.textContent="Single clicks do not count — use a DOUBLE-click!";room.appendChild(hint)}
window.addEventListener("resize",()=>{if(gameScreen.classList.contains("active"))setupRound()});
</script>
</body>
</html>
