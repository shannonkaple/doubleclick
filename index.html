<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mrs. Kaple's Double-Click Challenge</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #f5f3ff, #ecfeff);
    color: #1f2937;
    overflow: hidden;
    user-select: none;
  }
  .wrap {
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  header {
    background: white;
    border-bottom: 4px solid #ede9fe;
    padding: 14px 18px 12px;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(24px, 4vw, 42px);
  }
  .sub {
    margin-top: 7px;
    font-size: clamp(15px, 2vw, 20px);
    font-weight: 700;
  }
  .stats {
    margin-top: 10px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .pill {
    background: #f3f4f6;
    border: 2px solid #e5e7eb;
    border-radius: 999px;
    padding: 6px 14px;
    font-weight: 800;
    min-width: 100px;
  }
  #play {
    position: relative;
    overflow: hidden;
  }
  #target {
    position: absolute;
    width: 110px;
    height: 110px;
    display: grid;
    place-items: center;
    border: none;
    border-radius: 24px;
    background: white;
    box-shadow: 0 8px 22px rgba(0,0,0,.15);
    font-size: 72px;
    cursor: pointer;
    outline: 4px solid rgba(124,58,237,.12);
    touch-action: manipulation;
    transition: left .15s ease, top .15s ease, transform .08s ease, width .18s ease, height .18s ease, font-size .18s ease;
  }
  #target:active { transform: scale(.96); }
  .hint {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(44px, 9vw, 110px);
    font-weight: 900;
    opacity: .11;
    pointer-events: none;
    white-space: nowrap;
  }
  #message {
    position: absolute;
    left: 50%;
    top: 18px;
    transform: translateX(-50%);
    background: white;
    border: 3px solid #bbf7d0;
    color: #166534;
    padding: 10px 18px;
    border-radius: 16px;
    font-weight: 900;
    font-size: 20px;
    opacity: 0;
    transition: opacity .18s ease;
    pointer-events: none;
    box-shadow: 0 6px 18px rgba(0,0,0,.08);
  }
  #message.show { opacity: 1; }
  .footer-note {
    position: absolute;
    right: 10px;
    bottom: 8px;
    font-size: 12px;
    opacity: .45;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mrs. Kaple’s Double-Click Challenge</h1>
    <div class="sub">Find the emoji and <strong>DOUBLE-CLICK</strong> it!</div>
    <div class="stats">
      <div class="pill">Level <span id="level">1</span></div>
      <div class="pill">Score <span id="score">0</span></div>
    </div>
  </header>

  <main id="play">
    <div class="hint">DOUBLE-CLICK!</div>
    <button id="target" aria-label="Double-click the emoji">⭐</button>
    <div id="message">Great double-click!</div>
    <div class="footer-note">Unlimited levels — keep going!</div>
  </main>
</div>

<script>
const emojis = [
  "⭐","🐾","🌈","🚀","🦄","🐸","🍎","⚽","🎈","🐝",
  "🦋","🍕","🐙","🌻","🐢","🍓","☀️","🎨","🧩","🐬",
  "👑","🍪","🪁","🐳","🦖","🐧","🍉","🛸","🏀","🎯"
];

let level = 1;
let score = 0;

const play = document.getElementById("play");
const target = document.getElementById("target");
const levelEl = document.getElementById("level");
const scoreEl = document.getElementById("score");
const message = document.getElementById("message");

function sizeForLevel() {
  return Math.max(58, 110 - Math.floor((level - 1) / 3) * 4);
}

function placeTarget() {
  const size = sizeForLevel();
  target.style.width = size + "px";
  target.style.height = size + "px";
  target.style.fontSize = Math.max(36, size * 0.66) + "px";

  const pad = 12;
  const maxX = Math.max(pad, play.clientWidth - size - pad);
  const maxY = Math.max(pad, play.clientHeight - size - pad);

  const x = pad + Math.random() * Math.max(1, maxX - pad);
  const y = pad + Math.random() * Math.max(1, maxY - pad);

  target.style.left = x + "px";
  target.style.top = y + "px";
  target.textContent = emojis[Math.floor(Math.random() * emojis.length)];
}

function celebrate() {
  message.textContent = (level % 10 === 0) ? "WOW! Keep going! 🎉" : "Great double-click! ⭐";
  message.classList.add("show");
  clearTimeout(window.msgTimer);
  window.msgTimer = setTimeout(() => message.classList.remove("show"), 550);
}

target.addEventListener("dblclick", function(e) {
  e.preventDefault();
  score++;
  level++;
  scoreEl.textContent = score;
  levelEl.textContent = level;
  celebrate();
  placeTarget();
});

target.addEventListener("click", function(e) {
  e.preventDefault();
});

window.addEventListener("resize", placeTarget);
window.addEventListener("load", placeTarget);
</script>
</body>
</html>
