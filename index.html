<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ms. Kaple's Double-Click STEM Arcade</title>
<style>
@font-face{font-family:Homebody;src:url('./KAHomebodyClub.ttf') format('truetype');font-display:swap}@font-face{font-family:VAG;src:url('./VAGRoundedBold.ttf') format('truetype');font-display:swap}
:root{--ink:#171717;--pink:#ff5b9f;--orange:#ff8b27;--yellow:#ffd83a;--green:#72d653;--blue:#43c1eb;--purple:#a152df}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:VAG,Arial,sans-serif;background:#f4f5f7;color:var(--ink);user-select:none}button{font:inherit}#shell{min-height:100vh;border:11px solid transparent;border-image:linear-gradient(90deg,#ff3b7d 0 14%,#ff7d1f 14% 28%,#ffd52b 28% 42%,#4ed163 42% 57%,#27b6e6 57% 71%,#7348e7 71% 86%,#ff3b7d 86%) 1;background:#fff}header{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:9px 18px 11px;border-bottom:5px solid #222;background:#fff;font-family:Homebody,VAG,sans-serif;text-transform:uppercase}.brand{font-family:Homebody,VAG,sans-serif;font-size:clamp(31px,4.1vw,61px);line-height:.92;letter-spacing:.2px;white-space:nowrap;background:linear-gradient(90deg,#f52c8b,#ff7a18,#e9bd08,#48bf4d,#149fd8,#7240da,#e43ac4);-webkit-background-clip:text;background-clip:text;color:transparent}.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.nav button{font-family:Homebody,VAG,sans-serif;text-transform:uppercase;padding:8px 13px;min-height:43px;border:4px solid #222;border-radius:14px;background:#fff;box-shadow:0 3px 0 #222;cursor:pointer}.nav button:active{transform:translateY(2px);box-shadow:0 1px 0 #222}main{padding:14px}.view{display:none}.view.active{display:block}.home-note{text-align:center;font-size:clamp(18px,2vw,25px);margin:1px 0 14px}.game-grid{max-width:1360px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.game-card{border:5px solid #222;border-radius:20px;overflow:hidden;background:#fff;padding:0;cursor:pointer;box-shadow:0 5px 0 #222;min-height:265px;display:grid;grid-template-rows:auto 1fr auto}.game-card:active{transform:translateY(3px);box-shadow:0 2px 0 #222}.game-card .bar{padding:9px 10px;text-align:left;font-size:clamp(21px,2vw,31px);display:flex;align-items:center;gap:10px;line-height:1}.game-num{width:42px;height:42px;flex:0 0 42px;border:4px solid #222;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px}.game-card .thumb{height:145px;border-top:4px solid #222;border-bottom:4px solid #222;background:#fff;display:grid;place-items:center;overflow:hidden;padding:8px}.game-card .thumb img{max-width:90%;max-height:100%;width:auto;height:auto;object-fit:contain}.game-card .desc{text-align:center;padding:8px 10px;font-size:17px;line-height:1.1;background:#fff}.c1 .bar{background:var(--pink)}.c2 .bar{background:var(--yellow)}.c3 .bar{background:var(--green)}.c4 .bar{background:var(--blue)}.c5 .bar{background:var(--purple)}.c6 .bar{background:var(--orange)}
#gameTop{max-width:1420px;margin:0 auto 9px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}#gameTitle{font-size:clamp(25px,3vw,40px)}.stats{display:flex;gap:8px;justify-content:flex-end}.pill{border:4px solid #222;border-radius:999px;background:#fff;padding:7px 14px;font-size:18px}#direction{max-width:1420px;margin:0 auto 10px;border:4px solid #222;border-radius:17px;background:#fff;min-height:76px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;font-size:clamp(20px,2.1vw,30px)}#direction img{width:66px;height:58px;object-fit:contain}#stage{max-width:1420px;height:620px;margin:auto;border:5px solid #222;border-radius:22px;background:#f7fbff;position:relative;overflow:hidden}#toast{position:absolute;z-index:99;left:50%;top:16px;transform:translateX(-50%);border:4px solid #222;border-radius:15px;background:#fff;padding:8px 15px;font-size:22px;opacity:0;pointer-events:none;transition:.15s}#toast.show{opacity:1}.win{position:absolute;inset:0;z-index:90;background:rgba(255,255,255,.94);display:grid;place-items:center;text-align:center}.winbox{border:6px solid #222;border-radius:25px;background:#fff;padding:25px 38px;box-shadow:0 7px 0 #222}.win h2{font-size:clamp(50px,8vw,105px);margin:0;color:#8039d4}.win p{font-size:23px}.win button{border:4px solid #222;border-radius:14px;padding:10px 18px;background:#ffd83a;margin:5px;cursor:pointer}
.catch-bg{position:absolute;inset:0;background:linear-gradient(#dff6ff 0 68%,#e9d3a8 68%)}.catch-target{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;transition:left 1.35s ease-in-out,top 1.35s ease-in-out;animation:gentleHop 1.45s ease-in-out infinite alternate}.catch-target img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 2px rgba(0,0,0,.15))}@keyframes gentleHop{from{transform:translateY(-7px) rotate(-2deg)}to{transform:translateY(7px) rotate(2deg)}}.reveal{position:absolute;inset:14px;border-radius:16px;background:#1b0d32;overflow:hidden;display:grid;place-items:center}.reveal>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#1b0d32}.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:3px}.tile{border:0;cursor:pointer;background:linear-gradient(145deg,#8d46e5,#ff5ba7);outline:2px solid rgba(255,255,255,.7)}.tile:nth-child(3n+2){background:linear-gradient(145deg,#27b9ea,#6ddc64)}.tile:nth-child(3n){background:linear-gradient(145deg,#ffd42b,#ff7e1e)}.tile.gone{opacity:0;pointer-events:none;transition:.2s}
.desktop{position:absolute;inset:15px;border:4px solid #222;border-radius:16px;background:linear-gradient(#8adfff 0 65%,#78d55d 65%);overflow:hidden}.taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:#273646}.folders{position:absolute;inset:32px 30px 72px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;align-items:center}.folder{border:0;background:transparent;cursor:pointer;display:grid;justify-items:center;gap:3px}.folderpic{position:relative;width:180px;height:145px}.folderpic>img:first-child{width:100%;height:100%;object-fit:contain}.folderpic .badge{position:absolute;width:66px;height:58px;object-fit:contain;left:50%;top:50%;transform:translate(-50%,-45%);background:#fff;border:3px solid #222;border-radius:9px;padding:3px}.folderlabel{background:#fff;border:3px solid #222;border-radius:9px;padding:4px 8px}.fakewindow{position:absolute;z-index:60;width:min(760px,82%);left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:5px solid #222;border-radius:17px;box-shadow:0 15px 30px rgba(0,0,0,.25);overflow:hidden}.winbar{height:45px;background:#45bce8;border-bottom:4px solid #222;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-size:21px}.winbar button{width:38px;height:33px;border:3px solid #222;border-radius:8px;background:#ff6c80;cursor:pointer}.wincontent{text-align:center;padding:16px;font-size:21px}.wincontent img{width:180px;height:150px;object-fit:contain}
.sceneWrap{position:absolute;inset:14px;border-radius:15px;overflow:hidden;background:#fff}.sceneWrap>img{width:100%;height:100%;object-fit:fill}.hotspot{position:absolute;border:0;background:transparent;cursor:pointer}.hotspot.good{outline:6px solid #56c94c;border-radius:13px;background:rgba(86,201,76,.12)}.hotspot.bad{outline:6px solid #ff5c76;border-radius:13px;background:rgba(255,92,118,.12)}
.matchLayout{position:absolute;inset:15px;display:grid;grid-template-columns:.75fr 1.25fr;gap:14px}.matchTarget,.matchChoices{border:4px solid #222;border-radius:17px;background:#fff;padding:13px}.matchTarget{display:grid;place-items:center;text-align:center}.matchTarget img{width:230px;height:200px;object-fit:contain}.matchTarget h3{font-size:27px;margin:6px}.matchChoices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.matchChoice{border:4px solid #222;border-radius:15px;background:#f7fbff;cursor:pointer;display:grid;place-items:center;padding:8px}.matchChoice img{width:155px;height:135px;object-fit:contain}.collect{position:absolute;inset:15px;border:4px solid #222;border-radius:17px;background:linear-gradient(#e7f8ff,#fff6dd);overflow:hidden}.collectItem{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;animation:bob 3s ease-in-out infinite alternate}.collectItem img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 2px rgba(0,0,0,.14))}.collectItem.gone{opacity:0;pointer-events:none;transition:.2s}@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
@media(max-width:900px){header{grid-template-columns:1fr}.nav{justify-content:center}.brand{justify-content:center}.game-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#stage{height:720px}.folders{grid-template-columns:repeat(2,1fr)}.matchLayout{grid-template-columns:1fr}.matchChoices{grid-template-columns:repeat(4,1fr)}}@media(max-width:560px){.game-grid{grid-template-columns:1fr}.arcade{white-space:normal}}
</style></head><body><div id="shell"><header><div class="brand">MS. KAPLE'S DOUBLE-CLICK STEM ARCADE</div><div class="nav"><button id="homeBtn">GAMES</button><button id="resetBtn">RESET GAME</button><button id="prevBtn">◀ PREV</button><button id="nextBtn">NEXT ▶</button></div></header><main><section id="home" class="view active"><div class="home-note">CHOOSE A GAME</div><div id="cards" class="game-grid"></div></section><section id="game" class="view"><div id="gameTop"><div id="gameTitle"></div><div class="stats"><div class="pill">SCORE: <span id="score">0</span></div></div></div><div id="direction"></div><div id="stage"><div id="toast"></div></div></section></main></div>
<script>
const HOTSPOTS={"seek_scene.jpg": {"pencil": [47.524, 69.588, 1.14, 8.471], "scissors": [15.239, 59.024, 2.46, 9.6], "ruler": [50.516, 25.7, 0.78, 5.365], "glue": [83.171, 59.041, 2.22, 10.447], "notebook": [90.505, 83.294, 3.24, 9.882], "stapler": [5.407, 35.406, 4.56, 5.365]}};
const ASSETS={pencil:{word:'PENCIL',img:'pencil.png'},scissors:{word:'SCISSORS',img:'scissors.png'},glue:{word:'GLUE',img:'glue.png'},marker:{word:'MARKER',img:'marker.png'},notebook:{word:'NOTEBOOK',img:'notebook.png'},ruler:{word:'RULER',img:'ruler.png'},tape:{word:'TAPE',img:'tape.png'},paper:{word:'PAPER',img:'paper.png'},paint:{word:'PAINT',img:'paint.png'},brush:{word:'PAINTBRUSH',img:'brush.png'},clock:{word:'CLOCK',img:'clock.png'},desk:{word:'DESK',img:'desk.png'},chair:{word:'CHAIR',img:'chair.png'},bookcase:{word:'BOOKCASE',img:'bookcase.png'},whiteboard:{word:'WHITEBOARD',img:'whiteboard.png'},group_table:{word:'TABLE',img:'group_table.png'},paperclip:{word:'PAPER CLIP',img:'paperclip.png'},stapler:{word:'STAPLER',img:'stapler.png'},eraser:{word:'ERASER',img:'eraser.png'},pen:{word:'PEN',img:'pen.png'}};
const G=[
{title:'CATCH THE STEM ITEM',desc:'DOUBLE-CLICK THE MOVING ITEM',c:'c1',type:'catch',thumb:'pencil.png'},
{title:'REVEAL THE PICTURE',desc:'DOUBLE-CLICK TILES TO UNCOVER IT',c:'c2',type:'reveal',thumb:'reveal2.jpg'},
{title:'OPEN THE FILE',desc:'DOUBLE-CLICK THE MATCHING FILE',c:'c3',type:'files',thumb:'folder_green.png'},
{title:'FIND IT IN THE SCENE',desc:'SEARCH THE PICTURE AND DOUBLE-CLICK IT',c:'c4',type:'hunt',thumb:'seek_scene.jpg'},
{title:'FIND THE MATCH',desc:'DOUBLE-CLICK THE ITEM THAT GOES WITH IT',c:'c5',type:'match',thumb:'paint.png'},
{title:'COLLECT THEM ALL',desc:'DOUBLE-CLICK EVERY MATCHING ITEM',c:'c6',type:'collect',thumb:'ruler.png'}];
const cards=document.getElementById('cards'),home=document.getElementById('home'),game=document.getElementById('game'),stage=document.getElementById('stage'),direction=document.getElementById('direction'),gameTitle=document.getElementById('gameTitle'),scoreEl=document.getElementById('score');let current=0,score=0,round=1,timer=null;
function key(t,s){return `msKapleDC_${t}_${s}`}
function loadNum(k,d=0){const n=Number(localStorage.getItem(k));return Number.isFinite(n)?n:d}
function save(){localStorage.setItem(key(G[current].type,'score'),score);localStorage.setItem(key(G[current].type,'round'),round)}
function savedScore(type){return loadNum(key(type,'score'))}
function setScore(v){score=v;scoreEl.textContent=v;save()}
function setRound(v){round=v;save()}
function clearTimer(){if(timer){clearTimeout(timer);timer=null}}
function resetStage(){clearTimer();stage.innerHTML='<div id="toast"></div>'}
function dirPic(k,text){const a=ASSETS[k];direction.innerHTML=`<img src="${a.img}" alt="${a.word}"><span>${text.replace('{{WORD}}',a.word)}</span>`}
function dirText(t){direction.innerHTML=`<span>${t}</span>`}
function toast(t){const e=document.getElementById('toast');if(!e)return;e.textContent=t;e.classList.add('show');clearTimeout(e._x);e._x=setTimeout(()=>e.classList.remove('show'),650)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
G.forEach((g,i)=>{const b=document.createElement('button');b.className=`game-card ${g.c}`;b.innerHTML=`<div class="bar"><span class="game-num">${i+1}</span><span>${g.title}</span></div><div class="thumb"><img src="${g.thumb}" alt=""></div><div class="desc">${g.desc}</div>`;b.onclick=()=>startGame(i);cards.appendChild(b)});
function showHome(){clearTimer();game.classList.remove('active');home.classList.add('active')}
function startGame(i){current=(i+G.length)%G.length;home.classList.remove('active');game.classList.add('active');gameTitle.textContent=G[current].title;score=savedScore(G[current].type);round=Math.max(1,loadNum(key(G[current].type,'round'),1));scoreEl.textContent=score;setup()}
function resetCurrent(){localStorage.setItem(key(G[current].type,'score'),0);localStorage.setItem(key(G[current].type,'round'),1);score=0;round=1;scoreEl.textContent=0;setup()}
document.getElementById('homeBtn').onclick=showHome;
document.getElementById('resetBtn').onclick=resetCurrent;
document.getElementById('prevBtn').onclick=()=>startGame(current-1);
document.getElementById('nextBtn').onclick=()=>startGame(current+1);
function setup(){resetStage();const t=G[current].type;if(t==='catch')catchGame();if(t==='reveal')revealGame();if(t==='files')filesGame();if(t==='hunt')huntGame();if(t==='match')matchGame();if(t==='collect')collectGame()}
function win(){save();localStorage.setItem(key(G[current].type,'round'),1);const w=document.createElement('div');w.className='win';w.innerHTML=`<div class="winbox"><h2>YOU WIN!</h2><p>SCORE: ${score}</p><button class="again">KEEP PLAYING</button><button class="homewin">GAMES</button></div>`;w.querySelector('.again').onclick=()=>{setRound(1);setup()};w.querySelector('.homewin').onclick=showHome;stage.appendChild(w)}

// 1. Catch: gentle bouncing plus slow moves. More copies appear as the saved score grows.
const CATCH=[
{k:'pencil',copies:1},{k:'scissors',copies:1},{k:'ruler',copies:2},
{k:'marker',copies:2},{k:'notebook',copies:3},{k:'glue',copies:3}
];
function catchGame(){
  const lev=Math.min(CATCH.length-1,Math.floor(score/5)),cfg=CATCH[lev];
  dirPic(cfg.k,'CATCH THE {{WORD}}! DOUBLE-CLICK IT.');
  const bg=document.createElement('div');bg.className='catch-bg';stage.appendChild(bg);
  const movers=[];
  for(let i=0;i<cfg.copies;i++){
    const b=document.createElement('button');b.className='catch-target';
    b.style.width='122px';b.style.height='108px';
    b.style.animationDelay=(i*.22)+'s';
    b.innerHTML=`<img src="${ASSETS[cfg.k].img}" alt="${ASSETS[cfg.k].word}">`;
    b.addEventListener('click',e=>e.preventDefault());
    b.addEventListener('dblclick',e=>{
      e.preventDefault();
      setScore(score+1);toast('GREAT DOUBLE-CLICK!');
      const newLev=Math.min(CATCH.length-1,Math.floor(score/5));
      if(newLev!==lev){setTimeout(setup,250);return}
      moveOne(b,true);
    });
    stage.appendChild(b);movers.push(b)
  }
  function moveOne(b,quick=false){
    const W=stage.clientWidth,H=stage.clientHeight,w=122,h=108,pad=28;
    b.style.transitionDuration=quick?'.45s':'1.35s';
    b.style.left=(pad+Math.random()*Math.max(10,W-w-pad*2))+'px';
    b.style.top=(pad+Math.random()*Math.max(10,H-h-pad*2))+'px'
  }
  movers.forEach(b=>moveOne(b,true));
  function drift(){movers.forEach(b=>moveOne(b,false));timer=setTimeout(drift,2400)}
  timer=setTimeout(drift,2400)
}

// 2. Reveal: image is always CONTAIN, never cover; selected art has no edge-cut animals.
const REVEALS=['reveal1.jpg','reveal2.jpg','reveal3.jpg','reveal4.jpg'];function revealGame(){round=((round-1)%4)+1;save();dirText('DOUBLE-CLICK the tiles. The WHOLE picture stays on the screen!');const w=document.createElement('div');w.className='reveal';w.innerHTML=`<img src="${REVEALS[round-1]}" alt="Colorful technology picture"><div class="tiles"></div>`;const tiles=w.querySelector('.tiles');let left=15;for(let i=0;i<15;i++){const b=document.createElement('button');b.className='tile';b.addEventListener('click',e=>e.preventDefault());b.addEventListener('dblclick',e=>{e.preventDefault();if(b.classList.contains('gone'))return;b.classList.add('gone');setScore(score+1);left--;if(left===0){if(round>=4)setTimeout(win,650);else{setRound(round+1);setTimeout(setup,650)}}});tiles.appendChild(b)}stage.appendChild(w)}

// 3. Files: every folder has a UNIQUE picture; target clipart appears exactly once per screen.
const FILE_ROUNDS=[{target:'pencil',title:'ENGINEERING PLAN',fact:'Engineers sketch and label ideas before they build.'},{target:'scissors',title:'MAKER TOOL',fact:'Makers use tools safely to shape materials.'},{target:'notebook',title:'DATA NOTES',fact:'Scientists record observations and data.'},{target:'glue',title:'BUILD TOOL',fact:'Engineers connect materials when they build prototypes.'},{target:'ruler',title:'MEASURE',fact:'Engineers measure before they cut or build.'}];const FILE_KEYS=['pencil','scissors','notebook','glue','ruler','marker','tape','paper'];const FOLDERS=['folder_green.png','folder_yellow.png','folder_blue.png','folder_purple.png'];function filesGame(){round=((round-1)%FILE_ROUNDS.length)+1;save();const info=FILE_ROUNDS[round-1];dirPic(info.target,'DOUBLE-CLICK the {{WORD}} file.');const desk=document.createElement('div');desk.className='desktop';desk.innerHTML='<div class="taskbar"></div><div class="folders"></div>';const grid=desk.querySelector('.folders');let others=shuffle(FILE_KEYS.filter(k=>k!==info.target)).slice(0,3);let choices=shuffle([info.target,...others]);choices.forEach((k,i)=>{const b=document.createElement('button');b.className='folder';b.innerHTML=`<div class="folderpic"><img src="${FOLDERS[i%FOLDERS.length]}" alt="folder"><img class="badge" src="${ASSETS[k].img}" alt="${ASSETS[k].word}"></div><div class="folderlabel">${ASSETS[k].word}</div>`;b.addEventListener('click',e=>e.preventDefault());b.addEventListener('dblclick',e=>{e.preventDefault();if(k!==info.target){toast('That is a different file.');return}openWindow(info)});grid.appendChild(b)});stage.appendChild(desk)}function openWindow(info){const w=document.createElement('div');w.className='fakewindow';w.innerHTML=`<div class="winbar"><span>${info.title}</span><button aria-label="Close">×</button></div><div class="wincontent"><img src="${ASSETS[info.target].img}" alt="${ASSETS[info.target].word}"><div>${info.fact}</div><p style="font-size:16px">Click the X to close the file.</p></div>`;w.querySelector('button').onclick=()=>{w.remove();setScore(score+1);if(round>=FILE_ROUNDS.length)win();else{setRound(round+1);setTimeout(setup,200)}};stage.appendChild(w)}

// 4. Harder seek-and-find: a busy cartoon classroom with small hidden objects and exact hotspot areas.
const HUNT=[
{scene:'seek_scene.jpg',k:'pencil'},
{scene:'seek_scene.jpg',k:'scissors'},
{scene:'seek_scene.jpg',k:'ruler'},
{scene:'seek_scene.jpg',k:'glue'},
{scene:'seek_scene.jpg',k:'notebook'},
{scene:'seek_scene.jpg',k:'stapler'}
];
function huntGame(){
  round=((round-1)%HUNT.length)+1;save();
  const info=HUNT[round-1];
  dirPic(info.k,'FIND AND DOUBLE-CLICK THE {{WORD}} IN THE PICTURE.');
  const wrap=document.createElement('div');wrap.className='sceneWrap';
  wrap.innerHTML=`<img src="${info.scene}" alt="Busy cartoon classroom seek-and-find picture">`;
  wrap.addEventListener('dblclick',()=>toast('KEEP LOOKING!'));
  const map=HOTSPOTS[info.scene];
  Object.entries(map).forEach(([k,r])=>{
    const b=document.createElement('button');b.className='hotspot';
    b.style.left=r[0]+'%';b.style.top=r[1]+'%';b.style.width=r[2]+'%';b.style.height=r[3]+'%';
    b.addEventListener('click',e=>e.preventDefault());
    b.addEventListener('dblclick',e=>{
      e.preventDefault();e.stopPropagation();
      if(k!==info.k){toast('KEEP LOOKING!');return}
      b.classList.add('good');setScore(score+1);toast('YOU FOUND IT!');
      if(round>=HUNT.length)setTimeout(win,500);else{setRound(round+1);setTimeout(setup,500)}
    });
    wrap.appendChild(b)
  });
  stage.appendChild(wrap)
}

// 5. New game: functional STEM pairs, replacing the confusing design-station game.
const PAIRS=[{a:'paint',b:'brush'},{a:'pencil',b:'notebook'},{a:'marker',b:'whiteboard'},{a:'tape',b:'paper'},{a:'scissors',b:'paper'},{a:'ruler',b:'pencil'}];const MATCH_POOL=['brush','notebook','whiteboard','paper','pencil','scissors','marker','glue','ruler','eraser'];function matchGame(){round=((round-1)%PAIRS.length)+1;save();const p=PAIRS[round-1];dirPic(p.a,'What goes with the {{WORD}}? DOUBLE-CLICK its match.');const lay=document.createElement('div');lay.className='matchLayout';const left=document.createElement('div');left.className='matchTarget';left.innerHTML=`<div><img src="${ASSETS[p.a].img}" alt="${ASSETS[p.a].word}"><h3>${ASSETS[p.a].word}</h3></div>`;const choices=document.createElement('div');choices.className='matchChoices';let opts=shuffle(MATCH_POOL.filter(k=>k!==p.b)).slice(0,3);opts=shuffle([p.b,...opts]);opts.forEach(k=>{const b=document.createElement('button');b.className='matchChoice';b.innerHTML=`<img src="${ASSETS[k].img}" alt="${ASSETS[k].word}"><div>${ASSETS[k].word}</div>`;b.addEventListener('click',e=>e.preventDefault());b.addEventListener('dblclick',e=>{e.preventDefault();if(k!==p.b){toast('Try another match.');return}setScore(score+1);toast('That pair works!');if(round>=PAIRS.length)setTimeout(win,450);else{setRound(round+1);setTimeout(setup,450)}});choices.appendChild(b)});lay.append(left,choices);stage.appendChild(lay)}

// 6. Collect: target count varies by round instead of always 3.
const COLLECT=[{k:'pencil',n:2},{k:'scissors',n:4},{k:'ruler',n:3},{k:'marker',n:5},{k:'notebook',n:4}];const DIST=['glue','paperclip','eraser','tape','paper','paint','brush','stapler'];const SPOTS=[[5,9],[24,8],[43,10],[63,8],[81,10],[12,39],[32,40],[52,38],[72,41],[19,69],[42,68],[67,70],[84,67]];function collectGame(){round=((round-1)%COLLECT.length)+1;save();const info=COLLECT[round-1];dirPic(info.k,`Collect ALL ${info.n} {{WORD}} pictures.`);const board=document.createElement('div');board.className='collect';let items=Array(info.n).fill(info.k).concat(shuffle(DIST).slice(0,Math.min(7,SPOTS.length-info.n)));items=shuffle(items);let remaining=info.n;items.forEach((k,i)=>{const b=document.createElement('button');b.className='collectItem';b.style.left=SPOTS[i][0]+'%';b.style.top=SPOTS[i][1]+'%';b.style.width='112px';b.style.height='98px';b.style.animationDelay=(i*.13)+'s';b.innerHTML=`<img src="${ASSETS[k].img}" alt="${ASSETS[k].word}">`;b.addEventListener('click',e=>e.preventDefault());b.addEventListener('dblclick',e=>{e.preventDefault();if(k!==info.k){toast('Only collect the matching item.');return}if(b.classList.contains('gone'))return;b.classList.add('gone');remaining--;setScore(score+1);if(remaining===0){if(round>=COLLECT.length)setTimeout(win,500);else{setRound(round+1);setTimeout(setup,500)}}});board.appendChild(b)});stage.appendChild(board)}
</script></body></html>
